name: Build Auto Reel Saver APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.32.x'

      - name: Create Flutter Project & Install Packages
        run: |
          flutter create -a kotlin --org com.autosaver --project-name my_saver_app app_build
          cd app_build
          flutter pub add video_player

      - name: Configure Android XML & Manifest
        run: |
          mkdir -p app_build/android/app/src/main/res/xml
          mkdir -p app_build/android/app/src/main/res/values

          cat << 'EOF' > app_build/android/app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">محمّل الريلز الذكي</string>
              <string name="acc_desc">يكتشف النقر المزدوج خلف الهاتف أثناء استخدام تيك توك وانستغرام، ثم ينسخ رابط الفيديو ويحمّله تلقائياً بدون علامة مائية</string>
          </resources>
          EOF

          cat << 'EOF' > app_build/android/app/src/main/res/values/transparent.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="TransparentCaptureTheme" parent="@android:style/Theme.Translucent.NoTitleBar">
                  <item name="android:windowAnimationStyle">@null</item>
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:backgroundDimEnabled">false</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app_build/android/app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:description="@string/acc_desc"
              android:notificationTimeout="100" />
          EOF

          cat << 'EOF' > app_build/android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>

              <application
                  android:label="@string/app_name"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".ClipboardCaptureActivity"
                      android:exported="false"
                      android:theme="@style/TransparentCaptureTheme"
                      android:excludeFromRecents="true"
                      android:noHistory="true"
                      android:taskAffinity=""
                      android:launchMode="singleInstance" />

                  <service
                      android:name=".DownloadService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />

                  <service
                      android:name=".AutoReelGrabberService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Write Native Kotlin Engine
        run: |
          mkdir -p app_build/android/app/src/main/kotlin/com/autosaver/my_saver_app
          cat << 'EOF' > app_build/android/app/src/main/kotlin/com/autosaver/my_saver_app/MainActivity.kt
          package com.autosaver.my_saver_app

          import android.Manifest
          import android.app.NotificationManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val CHANNEL = "auto_saver/channel"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "openAccessibilitySettings" -> {
                              startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                              result.success(true)
                          }
                          "requestOverlayPermission" -> {
                              if (!Settings.canDrawOverlays(this)) {
                                  startActivity(
                                      Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                                  )
                              }
                              result.success(true)
                          }
                          "requestNotificationPermission" -> {
                              if (Build.VERSION.SDK_INT >= 33) {
                                  requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 77)
                              }
                              result.success(true)
                          }
                          "checkPermissions" -> {
                              val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                              result.success(
                                  mapOf(
                                      "accessibility" to isServiceEnabled(),
                                      "overlay" to Settings.canDrawOverlays(this),
                                      "notifications" to nm.areNotificationsEnabled()
                                  )
                              )
                          }
                          "updateSensitivity" -> {
                              val value = call.argument<Double>("value") ?: 11.5
                              getSharedPreferences("auto_saver_prefs", Context.MODE_PRIVATE)
                                  .edit().putFloat("sensitivity", value.toFloat()).apply()
                              result.success(true)
                          }
                          "getSensitivity" -> {
                              val v = getSharedPreferences("auto_saver_prefs", Context.MODE_PRIVATE)
                                  .getFloat("sensitivity", 11.5f)
                              result.success(v.toDouble())
                          }
                          "getLibrary" -> result.success(Library.load(this).toString())
                          "deleteVideo" -> {
                              Library.remove(this, call.argument<String>("id") ?: "")
                              result.success(true)
                          }
                          "downloadUrl" -> {
                              val url = call.argument<String>("url") ?: ""
                              if (url.isNotEmpty()) DownloadService.start(applicationContext, url)
                              result.success(true)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              private fun isServiceEnabled(): Boolean {
                  val expected = ComponentName(this, AutoReelGrabberService::class.java)
                  val enabled = Settings.Secure.getString(
                      contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return false
                  return enabled.split(':').any { ComponentName.unflattenFromString(it) == expected }
              }
          }
          EOF

          cat << 'EOF' > app_build/android/app/src/main/kotlin/com/autosaver/my_saver_app/AutoReelGrabberService.kt
          package com.autosaver.my_saver_app

          import android.accessibilityservice.AccessibilityService
          import android.content.Context
          import android.content.Intent
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.os.Handler
          import android.os.Looper
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import kotlin.math.abs

          class AutoReelGrabberService : AccessibilityService(), SensorEventListener {

              private val targets = setOf(
                  "com.zhiliaoapp.musically",
                  "com.zhiliaoapp.musically.go",
                  "com.ss.android.ugc.trill",
                  "com.instagram.android"
              )
              private val shareWords = listOf("share", "مشاركة", "send", "إرسال")
              private val copyWords = listOf("copy link", "copy url", "نسخ الرابط", "نسخ رابط")

              private var sensorManager: SensorManager? = null
              private var listening = false
              private var busy = false
              private var firstTapTime = 0L
              private var lastActionTime = 0L
              private val handler = Handler(Looper.getMainLooper())

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  sensorManager = getSystemService(Context.SENSOR_SERVICE) as SensorManager
              }

              // نُفعّل مستشعر الحركة فقط أثناء وجود تيك توك أو انستغرام في الواجهة لتوفير البطارية
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null || event.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
                  val pkg = event.packageName?.toString() ?: return
                  when {
                      pkg in targets -> startListening()
                      pkg == packageName || pkg == "android" ||
                          pkg.contains("systemui") || pkg.contains("inputmethod") || pkg.contains("keyboard") -> Unit
                      !busy -> stopListening()
                  }
              }

              private fun startListening() {
                  if (listening) return
                  val sensor = sensorManager?.getDefaultSensor(Sensor.TYPE_LINEAR_ACCELERATION) ?: return
                  sensorManager?.registerListener(this, sensor, SensorManager.SENSOR_DELAY_GAME)
                  listening = true
              }

              private fun stopListening() {
                  if (!listening) return
                  sensorManager?.unregisterListener(this)
                  listening = false
              }

              override fun onSensorChanged(event: SensorEvent?) {
                  if (event == null || busy) return
                  val x = abs(event.values[0])
                  val y = abs(event.values[1])
                  val z = abs(event.values[2])
                  if (z < 7f) return

                  val sensitivity = getSharedPreferences("auto_saver_prefs", Context.MODE_PRIVATE)
                      .getFloat("sensitivity", 11.5f)
                  if (!(z > sensitivity && x < 6.0f && y < 6.0f)) return

                  val now = System.currentTimeMillis()
                  if (now - lastActionTime < 4000) return

                  if (now - firstTapTime > 500) {
                      firstTapTime = now
                  } else if (now - firstTapTime in 120..500) {
                      firstTapTime = 0
                      lastActionTime = now
                      runAction()
                  }
              }

              private fun runAction() {
                  val root = rootInActiveWindow
                  val pkg = root?.packageName?.toString()
                  if (root == null || pkg !in targets) return

                  busy = true
                  Haptics.vibrate(this, 80)

                  if (!findAndClickNode(root, shareWords)) {
                      fail()
                      return
                  }
                  waitAndClickCopy(0)
              }

              // قائمة المشاركة قد تتأخر بالظهور، لذلك نحاول عدة مرات قبل الاستسلام
              private fun waitAndClickCopy(attempt: Int) {
                  handler.postDelayed({
                      val root = rootInActiveWindow
                      val clicked = root != null && findAndClickNode(root, copyWords)
                      when {
                          clicked -> handler.postDelayed({
                              val i = Intent(this, ClipboardCaptureActivity::class.java).apply {
                                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_NO_ANIMATION)
                              }
                              startActivity(i)
                              busy = false
                          }, 350)
                          attempt < 6 -> waitAndClickCopy(attempt + 1)
                          else -> fail()
                      }
                  }, 400)
              }

              private fun fail() {
                  Haptics.failure(this)
                  busy = false
              }

              private fun findAndClickNode(node: AccessibilityNodeInfo, keywords: List<String>): Boolean {
                  val text = node.text?.toString() ?: ""
                  val desc = node.contentDescription?.toString() ?: ""
                  val viewId = node.viewIdResourceName ?: ""

                  for (word in keywords) {
                      if (text.contains(word, ignoreCase = true) ||
                          desc.contains(word, ignoreCase = true) ||
                          viewId.contains(word, ignoreCase = true)
                      ) {
                          if (clickClickableParent(node)) return true
                      }
                  }
                  for (i in 0 until node.childCount) {
                      val child = node.getChild(i) ?: continue
                      if (findAndClickNode(child, keywords)) return true
                  }
                  return false
              }

              private fun clickClickableParent(node: AccessibilityNodeInfo?): Boolean {
                  var current = node
                  while (current != null) {
                      if (current.isClickable) return current.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                      current = current.parent
                  }
                  return false
              }

              override fun onUnbind(intent: Intent?): Boolean {
                  stopListening()
                  return super.onUnbind(intent)
              }

              override fun onDestroy() {
                  stopListening()
                  super.onDestroy()
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}
              override fun onInterrupt() {}
          }
          EOF

          cat << 'EOF' > app_build/android/app/src/main/kotlin/com/autosaver/my_saver_app/ClipboardCaptureActivity.kt
          package com.autosaver.my_saver_app

          import android.app.Activity
          import android.content.ClipboardManager
          import android.content.Context
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper

          // شاشة شفافة تظهر لجزء من الثانية فقط: لقراءة الحافظة (يتطلب أندرويد تركيزاً على نافذة)
          // ثم تسلّم الرابط لخدمة التحميل وتغلق نفسها فوراً.
          class ClipboardCaptureActivity : Activity() {
              private var handled = false
              private val handler = Handler(Looper.getMainLooper())

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  handler.postDelayed({ if (!handled) closeNow() }, 1500)
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (!hasFocus || handled) return
                  handled = true
                  handler.postDelayed({
                      try {
                          val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          val clip = cm.primaryClip
                          val text = if (clip != null && clip.itemCount > 0) {
                              clip.getItemAt(0).coerceToText(this).toString()
                          } else ""
                          if (text.contains("tiktok.com") || text.contains("instagram.com")) {
                              DownloadService.start(applicationContext, text)
                          } else {
                              Haptics.failure(this)
                          }
                      } catch (_: Exception) {
                      }
                      closeNow()
                  }, 80)
              }

              private fun closeNow() {
                  finish()
                  overridePendingTransition(0, 0)
              }
          }
          EOF

          cat << 'EOF' > app_build/android/app/src/main/kotlin/com/autosaver/my_saver_app/DownloadService.kt
          package com.autosaver.my_saver_app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder
          import org.json.JSONObject
          import java.io.File
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.concurrent.Executors
          import java.util.concurrent.atomic.AtomicInteger

          class DownloadService : Service() {

              companion object {
                  const val EXTRA_URL = "url"
                  private const val CHANNEL_ID = "downloads"
                  private const val FG_ID = 1001
                  private var lastUrl = ""
                  private var lastTime = 0L

                  @Synchronized
                  fun start(ctx: Context, url: String) {
                      val now = System.currentTimeMillis()
                      if (url == lastUrl && now - lastTime < 15000) return
                      lastUrl = url
                      lastTime = now
                      val i = Intent(ctx, DownloadService::class.java).putExtra(EXTRA_URL, url)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          ctx.startForegroundService(i)
                      } else {
                          ctx.startService(i)
                      }
                  }
              }

              private val executor = Executors.newSingleThreadExecutor()
              private val pending = AtomicInteger(0)
              private val resultCounter = AtomicInteger(0)
              private val nm: NotificationManager by lazy {
                  getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  createChannel()
                  val first = notif("جاري التحضير...", -1, true)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(FG_ID, first, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                  } else {
                      startForeground(FG_ID, first)
                  }

                  val url = intent?.getStringExtra(EXTRA_URL)
                  if (url == null) {
                      stopForegroundCompat()
                      stopSelf(startId)
                      return START_NOT_STICKY
                  }

                  pending.incrementAndGet()
                  executor.execute {
                      try {
                          process(url)
                      } catch (e: Exception) {
                          result("فشل التحميل: تأكد أن الحساب عام وأعد المحاولة", false)
                          Haptics.failure(this)
                      } finally {
                          if (pending.decrementAndGet() <= 0) {
                              stopForegroundCompat()
                              stopSelf(startId)
                          }
                      }
                  }
                  return START_NOT_STICKY
              }

              private fun process(rawUrl: String) {
                  val clean = Regex("https?://\\S+").find(rawUrl)?.value ?: rawUrl.trim()
                  val isTikTok = clean.contains("tiktok.com")
                  val isInsta = clean.contains("instagram.com")
                  if (!isTikTok && !isInsta) {
                      result("الرابط المنسوخ ليس فيديو تيك توك أو ريلز", false)
                      Haptics.failure(this)
                      return
                  }

                  update("جاري استخراج الفيديو...", -1)
                  var direct: String? = null
                  var title = "فيديو بدون علامة مائية"
                  val platform = if (isTikTok) "TikTok" else "Instagram Reels"

                  if (isTikTok) {
                      val body = "url=" + URLEncoder.encode(clean, "UTF-8") + "&hd=1"
                      val resp = post("https://www.tikwm.com/api/", body, "application/x-www-form-urlencoded", emptyMap())
                      val j = JSONObject(resp)
                      if (j.optInt("code", -1) == 0) {
                          val d = j.getJSONObject("data")
                          direct = str(d, "hdplay") ?: str(d, "play")
                          str(d, "title")?.let { title = it }
                          if (direct != null && direct.startsWith("/")) direct = "https://www.tikwm.com$direct"
                      }
                  } else {
                      val body = JSONObject().put("url", clean).toString()
                      val resp = post(
                          "https://api.cobalt.tools/api/json", body, "application/json",
                          mapOf("Accept" to "application/json")
                      )
                      direct = str(JSONObject(resp), "url")
                      title = "فيديو ريلز انستغرام"
                  }

                  if (direct.isNullOrEmpty()) throw Exception("no direct url")

                  val dir = File(filesDir, "downloaded_reels")
                  if (!dir.exists()) dir.mkdirs()
                  val id = System.currentTimeMillis().toString()
                  val dest = File(dir, "vid_$id.mp4")

                  update("جاري التنزيل... 0%", 0)
                  download(direct, dest)

                  Gallery.save(this, dest.absolutePath)

                  val sizeMb = String.format(Locale.US, "%.1f MB", dest.length() / (1024.0 * 1024.0))
                  val date = SimpleDateFormat("yyyy/MM/dd - HH:mm", Locale.US).format(Date())
                  Library.add(
                      this,
                      JSONObject()
                          .put("id", id)
                          .put("title", title)
                          .put("platform", platform)
                          .put("filePath", dest.absolutePath)
                          .put("date", date)
                          .put("sizeMb", sizeMb)
                  )

                  Haptics.vibrate(this, 300)
                  result("تم حفظ الفيديو في المعرض ✓", true)
              }

              private fun str(o: JSONObject, key: String): String? {
                  if (!o.has(key) || o.isNull(key)) return null
                  val s = o.optString(key).trim()
                  return if (s.isEmpty() || s == "null") null else s
              }

              private fun open(u: String): HttpURLConnection {
                  val c = URL(u).openConnection() as HttpURLConnection
                  c.connectTimeout = 15000
                  c.readTimeout = 30000
                  c.setRequestProperty(
                      "User-Agent",
                      "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36"
                  )
                  return c
              }

              private fun post(u: String, body: String, type: String, headers: Map<String, String>): String {
                  val c = open(u)
                  c.requestMethod = "POST"
                  c.doOutput = true
                  c.setRequestProperty("Content-Type", type)
                  headers.forEach { (k, v) -> c.setRequestProperty(k, v) }
                  c.outputStream.use { it.write(body.toByteArray()) }
                  val code = c.responseCode
                  val stream = if (code >= 400) c.errorStream else c.inputStream
                  val text = stream?.bufferedReader()?.use { it.readText() } ?: ""
                  if (code >= 400) throw Exception("HTTP $code")
                  return text
              }

              private fun download(urlStr: String, dest: File) {
                  val c = open(urlStr)
                  c.requestMethod = "GET"
                  if (c.responseCode >= 400) throw Exception("HTTP ${c.responseCode}")
                  val total = c.contentLengthLong
                  var read = 0L
                  var lastPct = -5
                  c.inputStream.use { input ->
                      FileOutputStream(dest).use { out ->
                          val buf = ByteArray(32 * 1024)
                          while (true) {
                              val n = input.read(buf)
                              if (n < 0) break
                              out.write(buf, 0, n)
                              read += n
                              if (total > 0) {
                                  val pct = (read * 100 / total).toInt()
                                  if (pct >= lastPct + 5) {
                                      lastPct = pct
                                      update("جاري التنزيل... $pct%", pct)
                                  }
                              }
                          }
                      }
                  }
              }

              private fun createChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      nm.createNotificationChannel(
                          NotificationChannel(CHANNEL_ID, "التحميلات", NotificationManager.IMPORTANCE_LOW)
                      )
                  }
              }

              private fun notif(text: String, progress: Int, ongoing: Boolean, done: Boolean = false): Notification {
                  val b = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, CHANNEL_ID)
                  } else {
                      @Suppress("DEPRECATION")
                      Notification.Builder(this)
                  }
                  b.setContentTitle("محمّل الريلز الذكي")
                      .setContentText(text)
                      .setSmallIcon(
                          if (done) android.R.drawable.stat_sys_download_done
                          else android.R.drawable.stat_sys_download
                      )
                      .setOngoing(ongoing)
                      .setOnlyAlertOnce(true)
                      .setContentIntent(
                          PendingIntent.getActivity(
                              this, 0, Intent(this, MainActivity::class.java),
                              PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                          )
                      )
                  if (ongoing) b.setProgress(100, progress.coerceAtLeast(0), progress < 0) else b.setAutoCancel(true)
                  return b.build()
              }

              private fun update(text: String, progress: Int) {
                  nm.notify(FG_ID, notif(text, progress, true))
              }

              private fun result(text: String, ok: Boolean) {
                  nm.notify(FG_ID + 1 + resultCounter.incrementAndGet(), notif(text, -1, false, ok))
              }

              @Suppress("DEPRECATION")
              private fun stopForegroundCompat() {
                  stopForeground(true)
              }

              override fun onDestroy() {
                  executor.shutdown()
                  super.onDestroy()
              }
          }
