          // ================= تصميم الواجهة الجديد: ألوان ومكوّنات مساعدة =================
          const Color kBg = Color(0xFF070B14);
          const Color kSurface = Color(0xFF111827);
          const Color kCardColor = Color(0xFF151D30);
          const Color kCyan = Color(0xFF22D3EE);
          const Color kViolet = Color(0xFF8B5CF6);
          const Color kPink = Color(0xFFEC4899);
          const Color kGreen = Color(0xFF34D399);
          const Color kAmber = Color(0xFFFBBF24);

          const LinearGradient kBrandGradient = LinearGradient(
            colors: [kCyan, kViolet],
            begin: Alignment.topRight,
            end: Alignment.bottomLeft,
          );

          // رادار نابض (له مؤقّت حركة خاص به، لا يعتمد على بقية الكود)
          class PulseRadar extends StatefulWidget {
            const PulseRadar({super.key});

            @override
            State<PulseRadar> createState() => _PulseRadarState();
          }

          class _PulseRadarState extends State<PulseRadar>
              with SingleTickerProviderStateMixin {
            late final AnimationController _c;

            @override
            void initState() {
              super.initState();
              _c = AnimationController(vsync: this, duration: const Duration(seconds: 3))
                ..repeat();
            }

            @override
            void dispose() {
              _c.dispose();
              super.dispose();
            }

            Widget _ring(double t) {
              final size = 70 + 100 * t;
              return Container(
                width: size,
                height: size,
                decoration: BoxDecoration(
                  shape: BoxShape.circle,
                  border: Border.all(
                    color: Colors.white.withOpacity((1 - t) * 0.5),
                    width: 2,
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return SizedBox(
                height: 170,
                child: AnimatedBuilder(
                  animation: _c,
                  builder: (context, _) {
                    return Stack(
                      alignment: Alignment.center,
                      children: [
                        for (int i = 0; i < 3; i++) _ring((_c.value + i / 3) % 1),
                        Container(
                          width: 74,
                          height: 74,
                          decoration: BoxDecoration(
                            shape: BoxShape.circle,
                            color: Colors.white.withOpacity(0.18),
                            border: Border.all(color: Colors.white54, width: 1.5),
                          ),
                          child: const Icon(
                            Icons.phone_android_rounded,
                            size: 36,
                            color: Colors.white,
                          ),
                        ),
                      ],
                    );
                  },
                ),
              );
            }
          }
