            String? _extractIgShortcodeFromText(String input) {
              final decoded = Uri.decodeFull(input);
              final reg = RegExp(
                r'instagram\.com/(?!share/)(?:[A-Za-z0-9_.-]+/)?(?:reel|reels|p|tv)/([A-Za-z0-9_-]+)',
                caseSensitive: false,
              );
              final match = reg.firstMatch(decoded);
              if (match != null && match.group(1) != null) {
                return match.group(1);
              }
              final fallback =
                  RegExp(r'/(?:reel|reels|p|tv)/([A-Za-z0-9_-]{6,})')
                      .firstMatch(decoded);
              if (fallback != null && !decoded.contains('/share/')) {
                return fallback.group(1);
              }
              return null;
            }

            Future<String?> _resolveShareLinkShortcode(String url) async {
              final directCode = _extractIgShortcodeFromText(url);
              if (directCode != null) return directCode;

              try {
                String currentUrl = url;
                for (int i = 0; i < 6; i++) {
                  final client = HttpClient();
                  client.connectionTimeout = const Duration(seconds: 8);
                  client.userAgent =
                      'facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)';
                  final req = await client.getUrl(Uri.parse(currentUrl));
                  req.followRedirects = false;
                  final res = await req.close();
                  final loc = res.headers.value(HttpHeaders.locationHeader);
                  client.close(force: true);

                  if (loc == null || loc.isEmpty) break;
                  final fullLoc = loc.startsWith('http')
                      ? loc
                      : 'https://www.instagram.com$loc';
                  final code = _extractIgShortcodeFromText(fullLoc);
                  if (code != null) return code;
                  // FIX: stop following if Instagram redirects to login page - no point continuing
                  if (fullLoc.contains('/accounts/login')) break;
                  currentUrl = fullLoc;
                }
              } catch (_) {}
              return null;
            }

            List<String> _extractAllValidVideoUrls(String raw) {
              final List<String> results = [];
              final norm = raw
                  .replaceAll(r'\\/', '/')
                  .replaceAll(r'\/', '/')
                  .replaceAll(r'\\u0026', '&')
                  .replaceAll(r'\u0026', '&')
                  .replaceAll(r'\"', '"')
                  .replaceAll('&amp;', '&');

              void addCandidate(String? u) {
                if (u == null) return;
                final clean = u.trim();
                if (!clean.startsWith('http')) return;
                if (clean.contains('static.cdninstagram.com')) return;
                if (clean.contains('bytestart=')) return;
                if (clean.contains('.jpg') ||
                    clean.contains('.jpeg') ||
                    clean.contains('.png') ||
                    clean.contains('.webp') ||
                    clean.contains('.js') ||
                    clean.contains('.css')) return;
                if (!results.contains(clean)) {
                  results.add(clean);
                }
              }

              for (final m in RegExp(r'"video_url"\s*:\s*"(https?://[^"]+)"')
                  .allMatches(norm)) {
                addCandidate(m.group(1));
              }

              for (final m in RegExp(
                      r'"video_versions"\s*:\s*\[\s*\{[^}]*"url"\s*:\s*"(https?://[^"]+)"')
                  .allMatches(norm)) {
                addCandidate(m.group(1));
              }

              for (final m
                  in RegExp(r'<video[^>]+src="(https?://[^"]+)"').allMatches(norm)) {
                addCandidate(m.group(1));
              }

              for (final m in RegExp(
                r'"(?:url|hdplay|play|noWatermark|video)"\s*:\s*"(https?://[^"]+)"',
                caseSensitive: false,
              ).allMatches(norm)) {
                final c = m.group(1)!;
                if (!c.contains('instagram.com/reel/') &&
                    !c.contains('instagram.com/p/')) {
                  addCandidate(c);
                }
              }

              return results;
            }

            Future<String?> _extractViaPubler(String cleanUrl) async {
              try {
                final initRes = await _dio.post(
                  'https://app.publer.io/hooks/media',
                  data: jsonEncode({'url': cleanUrl, 'iphone': false}),
                  options: Options(
                    headers: {
                      'Content-Type': 'application/json',
                      'Origin': 'https://publer.io',
                      'Referer': 'https://publer.io/',
                    },
                  ),
                );
                final initMap = initRes.data is String
                    ? jsonDecode(initRes.data)
                    : initRes.data;
                final jobId = initMap['job_id']?.toString();
                if (jobId == null || jobId.isEmpty) return null;

                for (int i = 0; i < 7; i++) {
                  await Future.delayed(const Duration(milliseconds: 1200));
                  final pollRes = await _dio.get(
                    'https://app.publer.io/api/v1/job_status/$jobId',
                    options: Options(headers: {
                      'Origin': 'https://publer.io',
                      'Referer': 'https://publer.io/',
                    }),
                  );
                  final pollMap = pollRes.data is String
                      ? jsonDecode(pollRes.data)
                      : pollRes.data;
                  if (pollMap['status'] == 'complete') {
                    final payload = pollMap['payload'];
                    if (payload is List && payload.isNotEmpty) {
                      final path = payload[0]['path']?.toString();
                      if (path != null && path.startsWith('http')) return path;
                    }
                    break;
                  }
                }
              } catch (_) {}
              return null;
            }

            // FIX: new engine - user-configurable private server (yt-dlp based).
            // This is the ONLY reliable long-term method. See server.py in repo.
            Future<String?> _tryCustomServer(String targetUrl) async {
              final base = _customApiController.text.trim();
              if (base.isEmpty) return null;
              try {
                final sep = base.contains('?') ? '&' : '?';
                final res = await _dio.get(
                  '$base${sep}url=${Uri.encodeComponent(targetUrl)}',
                );
                if (res.data is String) {
                  final t = (res.data as String).trim();
                  if (t.startsWith('http')) return t;
                }
                dynamic data = res.data;
                try {
                  data = res.data is String ? jsonDecode(res.data) : res.data;
                } catch (_) {}
                String? candidate;
                void dig(dynamic d) {
                  if (candidate != null || d == null) return;
                  if (d is Map) {
                    for (final k in [
                      'url', 'video', 'video_url', 'hdplay', 'play', 'download', 'link'
                    ]) {
                      final v = d[k];
                      if (v is String &&
                          v.startsWith('http') &&
                          !v.contains('.jpg') &&
                          !v.contains('.png')) {
                        candidate = v;
                        return;
                      }
                    }
                    d.forEach((_, v) => dig(v));
                  } else if (d is List) {
                    for (final v in d) dig(v);
                  }
                }
                dig(data);
                return candidate;
              } catch (_) {}
              return null;
            }

            // تجربة تحميل الرابط وفحصه برمجياً - مع اسم المحرك لتشخيص سبب الفشل
            Future<bool> _tryDownloadAndVerifyVideo(
              String candidateUrl,
              String savePath,
              bool isTikTok,
              String engineName,
            ) async {
              try {
                final f = File(savePath);
                if (await f.exists()) await f.delete();

                setState(() => _statusText = "جاري التحميل عبر محرك: $engineName");

                await _dio.download(
                  candidateUrl,
                  savePath,
                  options: Options(
                    headers: {
                      // FIX: tikwm media URLs need tikwm referer, not tiktok referer
                      'Referer': engineName.contains('tikwm')
                          ? 'https://www.tikwm.com/'
                          : (isTikTok
                              ? 'https://www.tiktok.com/'
                              : 'https://www.instagram.com/'),
                      'Accept': '*/*',
                    },
                  ),
                  onReceiveProgress: (rec, total) {
                    if (total > 150000) {
                      setState(() => _progress = rec / total);
                    }
                  },
                );

                final isValid = await _channel.invokeMethod<bool>(
                      'validateVideoFile',
                      {'path': savePath},
                    ) ??
                    false;

                if (!isValid) {
                  if (await f.exists()) await f.delete();
                  // FIX: tell the user WHICH engine failed and why
                  setState(() => _statusText =
                      "فشل محرك $engineName (ملف غير صالح)، جارٍ تجربة المحرك التالي...");
                  return false;
                }
                return true;
              } catch (e) {
                final f = File(savePath);
                if (await f.exists()) await f.delete();
                setState(() => _statusText =
                    "فشل محرك $engineName (${e.toString().split('\n').first})، جارٍ تجربة المحرك التالي...");
                return false;
              }
            }

            Future<bool> _downloadTikTokVerified(
