          // ==========================================================
          // شاشة مشغل الفيديو الداخلي
          // ==========================================================
          class InAppVideoPlayerScreen extends StatefulWidget {
            final DownloadedVideoItem videoItem;
            const InAppVideoPlayerScreen({super.key, required this.videoItem});

            @override
            State<InAppVideoPlayerScreen> createState() => _InAppVideoPlayerScreenState();
          }

          class _InAppVideoPlayerScreenState extends State<InAppVideoPlayerScreen> {
            late VideoPlayerController _controller;
            bool _initialized = false;

            @override
            void initState() {
              super.initState();
              _controller = VideoPlayerController.file(File(widget.videoItem.filePath))
                ..initialize().then((_) {
                  if (!mounted) return;
                  setState(() => _initialized = true);
                  _controller.setLooping(true);
                  _controller.play();
                });
              _controller.addListener(() {
                if (mounted) setState(() {});
              });
            }

            @override
            void dispose() {
              _controller.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Directionality(
                textDirection: TextDirection.rtl,
                child: Scaffold(
                  backgroundColor: Colors.black,
                  extendBodyBehindAppBar: true,
                  appBar: AppBar(
                    backgroundColor: Colors.transparent,
                    elevation: 0,
                    title: Text(
                      widget.videoItem.title,
                      maxLines: 1,
                      overflow: TextOverflow.ellipsis,
                      style: const TextStyle(fontSize: 15),
                    ),
                  ),
                  body: _initialized
                      ? GestureDetector(
                          onTap: () => _controller.value.isPlaying
                              ? _controller.pause()
                              : _controller.play(),
                          child: Stack(
                            alignment: Alignment.center,
                            children: [
                              Center(
                                child: AspectRatio(
                                  aspectRatio: _controller.value.aspectRatio,
                                  child: VideoPlayer(_controller),
                                ),
                              ),
                              AnimatedOpacity(
                                opacity: _controller.value.isPlaying ? 0 : 1,
                                duration: const Duration(milliseconds: 200),
                                child: Container(
                                  padding: const EdgeInsets.all(18),
                                  decoration: const BoxDecoration(
                                    color: Colors.black54,
                                    shape: BoxShape.circle,
                                  ),
                                  child: const Icon(Icons.play_arrow_rounded,
                                      size: 56, color: Colors.white),
                                ),
                              ),
                              Positioned(
                                left: 16,
                                right: 16,
                                bottom: 28,
                                child: VideoProgressIndicator(
                                  _controller,
                                  allowScrubbing: true,
                                  padding: const EdgeInsets.symmetric(vertical: 12),
                                  colors: const VideoProgressColors(
                                    playedColor: kCyan,
                                    bufferedColor: Colors.white24,
                                    backgroundColor: Colors.white12,
                                  ),
                                ),
                              ),
                            ],
                          ),
                        )
                      : const Center(child: CircularProgressIndicator(color: kCyan)),
                ),
              );
            }
          }


          // ==========================================================
          // نقطة دخول محرك الخلفية (بدون واجهة) — تُشغَّل من DownloadService
          // ==========================================================
          @pragma('vm:entry-point')
          Future<void> backgroundMain() async {
            WidgetsFlutterBinding.ensureInitialized();
            bool busy = false;

            kChannel.setMethodCallHandler((call) async {
              if (call.method == 'startJob') {
                final url = call.arguments as String? ?? '';
                if (busy) return;
                busy = true;
                try {
                  final prefs = await SharedPreferences.getInstance();
                  await prefs.reload();
                  int lastPct = -1;
                  final dl = ReelDownloader(
                    customApi: prefs.getString('custom_api_url') ?? '',
                    onStatus: (s) {
                      kChannel.invokeMethod('bgProgress', {'text': s});
                    },
                    onProgress: (p) {
                      final pct = (p * 100).toInt();
                      if (pct != lastPct) {
                        lastPct = pct;
                        kChannel.invokeMethod('bgProgress', {'progress': pct});
                      }
                    },
                  );
                  final r = await dl.download(url);
                  await kChannel.invokeMethod('bgDone', {'ok': r.ok, 'message': r.message});
                } catch (e) {
                  await kChannel.invokeMethod('bgDone', {'ok': false, 'message': 'تعذر التحميل: $e'});
                } finally {
                  busy = false;
                }
              }
            });

            await kChannel.invokeMethod('bgReady');
          }
