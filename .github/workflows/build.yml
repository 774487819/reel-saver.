            void _openVideoPlayerModal(DownloadedVideoItem item) {
              Navigator.of(context).push(
                MaterialPageRoute(
                  builder: (_) => InAppVideoPlayerScreen(videoItem: item),
                ),
              );
            }
          }

          class InAppVideoPlayerScreen extends StatefulWidget {
            final DownloadedVideoItem videoItem;
            const InAppVideoPlayerScreen({super.key, required this.videoItem});

            @override
            State<InAppVideoPlayerScreen> createState() =>
                _InAppVideoPlayerScreenState();
          }

          class _InAppVideoPlayerScreenState
              extends State<InAppVideoPlayerScreen> {
            late VideoPlayerController _controller;
            bool _initialized = false;

            @override
            void initState() {
              super.initState();
              _controller =
                  VideoPlayerController.file(File(widget.videoItem.filePath))
                    ..initialize().then((_) {
                      setState(() => _initialized = true);
                      _controller.setLooping(true);
                      _controller.play();
                    });
            }

            @override
            void dispose() {
              _controller.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Directionality(
                textDirection: TextDirection.rtl,
                child: Scaffold(
                  backgroundColor: Colors.black,
                  appBar: AppBar(
                    backgroundColor: Colors.black,
                    title: Text(
                      widget.videoItem.title,
                      style: const TextStyle(fontSize: 15),
                    ),
                  ),
                  body: Center(
                    child: _initialized
                        ? GestureDetector(
                            onTap: () {
                              setState(() {
                                _controller.value.isPlaying
                                    ? _controller.pause()
                                    : _controller.play();
                              });
                            },
                            child: Stack(
                              alignment: Alignment.center,
                              children: [
                                AspectRatio(
                                  aspectRatio: _controller.value.aspectRatio,
                                  child: VideoPlayer(_controller),
                                ),
                                if (!_controller.value.isPlaying)
                                  Container(
                                    padding: const EdgeInsets.all(16),
                                    decoration: const BoxDecoration(
                                      color: Colors.black54,
                                      shape: BoxShape.circle,
                                    ),
                                    child: const Icon(
                                      Icons.play_arrow_rounded,
                                      size: 54,
                                      color: Colors.white,
                                    ),
                                  ),
                              ],
                            ),
                          )
                        : const CircularProgressIndicator(
                            color: Color(0xFF00F2FE)),
                  ),
                ),
              );
            }
          }
