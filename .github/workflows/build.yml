name: Build Auto Reel Saver APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project & Install Packages
        run: |
          flutter create -a kotlin --org com.autosaver --project-name my_saver_app app_build
          cd app_build
          flutter pub add dio shared_preferences path_provider video_player youtube_explode_dart

      - name: Configure Android XML & Manifest
        run: |
          mkdir -p app_build/android/app/src/main/res/xml
          mkdir -p app_build/android/app/src/main/res/values

          cat << 'EOF' > app_build/android/app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">محمّل الريلز الذكي</string>
              <string name="acc_desc">يكتشف النقر المزدوج خلف الهاتف أثناء استخدام تيك توك وانستغرام ويوتيوب، ثم ينسخ رابط الفيديو ويحمّله تلقائياً بدون علامة مائية</string>
          </resources>
          EOF

          cat << 'EOF' > app_build/android/app/src/main/res/values/transparent.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="TransparentCaptureTheme" parent="@android:style/Theme.Translucent.NoTitleBar">
                  <item name="android:windowAnimationStyle">@null</item>
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:backgroundDimEnabled">false</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app_build/android/app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
              android:description="@string/acc_desc"
              android:notificationTimeout="100" />
          EOF

          cat << 'EOF' > app_build/android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>

              <application
                  android:label="@string/app_name"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".ClipboardCaptureActivity"
                      android:exported="false"
                      android:theme="@style/TransparentCaptureTheme"
                      android:excludeFromRecents="true"
                      android:noHistory="true"
                      android:taskAffinity=""
                      android:launchMode="singleInstance" />

                  <service
                      android:name=".DownloadService"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />

                  <service
                      android:name=".AutoReelGrabberService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Write Native Kotlin Engine
        run: |
          mkdir -p app_build/android/app/src/main/kotlin/com/autosaver/my_saver_app
          cat << 'EOF' > app_build/android/app/src/main/kotlin/com/autosaver/my_saver_app/MainActivity.kt
          package com.autosaver.my_saver_app

          import android.Manifest
          import android.app.NotificationManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.provider.Settings
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private val CHANNEL = "auto_saver/channel"

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      if (NativeBridge.handle(applicationContext, call, result)) return@setMethodCallHandler
                      when (call.method) {
                          "openAccessibilitySettings" -> {
                              startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                              result.success(true)
                          }
                          "requestOverlayPermission" -> {
                              if (!Settings.canDrawOverlays(this)) {
                                  startActivity(
                                      Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                                  )
                              }
                              result.success(true)
                          }
                          "requestNotificationPermission" -> {
                              if (Build.VERSION.SDK_INT >= 33) {
                                  requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 77)
                              }
                              result.success(true)
                          }
                          "checkPermissions" -> {
                              val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                              result.success(
                                  mapOf(
                                      "accessibility" to isServiceEnabled(),
                                      "overlay" to Settings.canDrawOverlays(this),
                                      "notifications" to nm.areNotificationsEnabled()
                                  )
                              )
                          }
                          "updateSensitivity" -> {
                              val value = call.argument<Double>("value") ?: 11.5
                              getSharedPreferences("auto_saver_prefs", Context.MODE_PRIVATE)
                                  .edit().putFloat("sensitivity", value.toFloat()).apply()
                              result.success(true)
                          }
                          "getSensitivity" -> {
                              val v = getSharedPreferences("auto_saver_prefs", Context.MODE_PRIVATE)
                                  .getFloat("sensitivity", 11.5f)
                              result.success(v.toDouble())
                          }
                          "downloadUrl" -> {
                              val url = call.argument<String>("url") ?: ""
                              if (url.isNotEmpty()) DownloadService.start(applicationContext, url)
                              result.success(true)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              private fun isServiceEnabled(): Boolean {
                  val expected = ComponentName(this, AutoReelGrabberService::class.java)
                  val enabled = Settings.Secure.getString(
                      contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return false
                  return enabled.split(':').any { ComponentName.unflattenFromString(it) == expected }
              }
          }
          EOF

          cat << 'EOF' > app_build/android/app/src/main/kotlin/com/autosaver/my_saver_app/AutoReelGrabberService.kt
          package com.autosaver.my_saver_app

          import android.accessibilityservice.AccessibilityService
          import android.content.Context
          import android.content.Intent
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.os.Handler
          import android.os.Looper
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import kotlin.math.abs

          class AutoReelGrabberService : AccessibilityService(), SensorEventListener {

              private val targets = setOf(
                  "com.zhiliaoapp.musically",
                  "com.zhiliaoapp.musically.go",
                  "com.ss.android.ugc.trill",
                  "com.instagram.android",
                  "com.google.android.youtube"
              )
              private val shareWords = listOf("share", "مشاركة", "send", "إرسال")
              private val copyWords = listOf("copy link", "copy url", "نسخ الرابط", "نسخ رابط")

              private var sensorManager: SensorManager? = null
              private var listening = false
              private var busy = false
              private var firstTapTime = 0L
              private var lastActionTime = 0L
              private val handler = Handler(Looper.getMainLooper())

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  sensorManager = getSystemService(Context.SENSOR_SERVICE) as SensorManager
              }

              // نُفعّل مستشعر الحركة فقط أثناء وجود تيك توك أو انستغرام في الواجهة لتوفير البطارية
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null || event.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
                  val pkg = event.packageName?.toString() ?: return
                  when {
                      pkg in targets -> startListening()
                      pkg == packageName || pkg == "android" ||
                          pkg.contains("systemui") || pkg.contains("inputmethod") || pkg.contains("keyboard") -> Unit
                      !busy -> stopListening()
                  }
              }

              private fun startListening() {
                  if (listening) return
                  val sensor = sensorManager?.getDefaultSensor(Sensor.TYPE_LINEAR_ACCELERATION) ?: return
                  sensorManager?.registerListener(this, sensor, SensorManager.SENSOR_DELAY_GAME)
                  listening = true
              }

              private fun stopListening() {
                  if (!listening) return
                  sensorManager?.unregisterListener(this)
                  listening = false
              }

              override fun onSensorChanged(event: SensorEvent?) {
                  if (event == null || busy) return
                  val x = abs(event.values[0])
                  val y = abs(event.values[1])
                  val z = abs(event.values[2])
                  if (z < 7f) return

                  val sensitivity = getSharedPreferences("auto_saver_prefs", Context.MODE_PRIVATE)
                      .getFloat("sensitivity", 11.5f)
                  if (!(z > sensitivity && x < 6.0f && y < 6.0f)) return

                  val now = System.currentTimeMillis()
                  if (now - lastActionTime < 4000) return

                  if (now - firstTapTime > 500) {
                      firstTapTime = now
                  } else if (now - firstTapTime in 120..500) {
                      firstTapTime = 0
                      lastActionTime = now
                      runAction()
                  }
              }

              private fun runAction() {
                  val root = rootInActiveWindow
                  val pkg = root?.packageName?.toString()
                  if (root == null || pkg !in targets) return

                  busy = true
                  Haptics.vibrate(this, 80)

                  if (!findAndClickNode(root, shareWords)) {
                      fail()
                      return
                  }
                  waitAndClickCopy(0)
              }

              // قائمة المشاركة قد تتأخر بالظهور، لذلك نحاول عدة مرات قبل الاستسلام
              private fun waitAndClickCopy(attempt: Int) {
                  handler.postDelayed({
                      val root = rootInActiveWindow
                      val clicked = root != null && findAndClickNode(root, copyWords)
                      when {
                          clicked -> handler.postDelayed({
                              val i = Intent(this, ClipboardCaptureActivity::class.java).apply {
                                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_NO_ANIMATION)
                              }
                              startActivity(i)
                              busy = false
                          }, 350)
                          attempt < 6 -> waitAndClickCopy(attempt + 1)
                          else -> fail()
                      }
                  }, 400)
              }

              private fun fail() {
                  Haptics.failure(this)
                  busy = false
              }

              private fun findAndClickNode(node: AccessibilityNodeInfo, keywords: List<String>): Boolean {
                  val text = node.text?.toString() ?: ""
                  val desc = node.contentDescription?.toString() ?: ""
                  val viewId = node.viewIdResourceName ?: ""

                  for (word in keywords) {
                      if (text.contains(word, ignoreCase = true) ||
                          desc.contains(word, ignoreCase = true) ||
                          viewId.contains(word, ignoreCase = true)
                      ) {
                          if (clickClickableParent(node)) return true
                      }
                  }
                  for (i in 0 until node.childCount) {
                      val child = node.getChild(i) ?: continue
                      if (findAndClickNode(child, keywords)) return true
                  }
                  return false
              }

              private fun clickClickableParent(node: AccessibilityNodeInfo?): Boolean {
                  var current = node
                  while (current != null) {
                      if (current.isClickable) return current.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                      current = current.parent
                  }
                  return false
              }

              override fun onUnbind(intent: Intent?): Boolean {
                  stopListening()
                  return super.onUnbind(intent)
              }

              override fun onDestroy() {
                  stopListening()
                  super.onDestroy()
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}
              override fun onInterrupt() {}
          }
          EOF

          cat << 'EOF' > app_build/android/app/src/main/kotlin/com/autosaver/my_saver_app/ClipboardCaptureActivity.kt
          package com.autosaver.my_saver_app

          import android.app.Activity
          import android.content.ClipboardManager
          import android.content.Context
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper

          // شاشة شفافة تظهر لجزء من الثانية فقط: لقراءة الحافظة (يتطلب أندرويد تركيزاً على نافذة)
          // ثم تسلّم الرابط لخدمة التحميل وتغلق نفسها فوراً.
          class ClipboardCaptureActivity : Activity() {
              private var handled = false
              private val handler = Handler(Looper.getMainLooper())

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  handler.postDelayed({ if (!handled) closeNow() }, 1500)
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (!hasFocus || handled) return
                  handled = true
                  handler.postDelayed({
                      try {
                          val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          val clip = cm.primaryClip
                          val text = if (clip != null && clip.itemCount > 0) {
                              clip.getItemAt(0).coerceToText(this).toString()
                          } else ""
                          if (text.contains("tiktok.com") || text.contains("instagram.com") || text.contains("youtube.com") || text.contains("youtu.be")) {
                              DownloadService.start(applicationContext, text)
                          } else {
                              Haptics.failure(this)
                          }
                      } catch (_: Exception) {
                      }
                      closeNow()
                  }, 80)
              }

              private fun closeNow() {
                  finish()
                  overridePendingTransition(0, 0)
              }
          }
          EOF

          cat << 'EOF' > app_build/android/app/src/main/kotlin/com/autosaver/my_saver_app/DownloadService.kt
          package com.autosaver.my_saver_app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import io.flutter.FlutterInjector
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.embedding.engine.dart.DartExecutor
          import io.flutter.plugin.common.MethodChannel

          // خدمة أمامية تشغّل محرك Flutter بدون واجهة (backgroundMain) لتنفيذ التحميل بنفس منطق Dart
          class DownloadService : Service() {

              companion object {
                  const val EXTRA_URL = "url"
                  private const val CHANNEL_ID = "downloads"
                  private const val FG_ID = 1001
                  private var lastUrl = ""
                  private var lastTime = 0L

                  @Synchronized
                  fun start(ctx: Context, url: String) {
                      val now = System.currentTimeMillis()
                      if (url == lastUrl && now - lastTime < 15000) return
                      lastUrl = url
                      lastTime = now
                      val i = Intent(ctx, DownloadService::class.java).putExtra(EXTRA_URL, url)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) ctx.startForegroundService(i) else ctx.startService(i)
                  }
              }

              private val main = Handler(Looper.getMainLooper())
              private var engine: FlutterEngine? = null
              private var channel: MethodChannel? = null
              private var ready = false
              private var running = false
              private var lastStartId = 0
              private var lastText = "جاري التحضير..."
              private val queue = ArrayDeque<String>()
              private var resultCounter = 0
              private val watchdog = Runnable {
                  destroyEngine()
                  finishJob(false, "انتهت مهلة التحميل، أعد المحاولة.")
              }
              private val nm: NotificationManager by lazy {
                  getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  lastStartId = startId
                  createChannel()
                  val first = notif(lastText, -1, true)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(FG_ID, first, ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC)
                  } else {
                      startForeground(FG_ID, first)
                  }

                  val url = intent?.getStringExtra(EXTRA_URL)
                  if (url.isNullOrEmpty()) {
                      if (!running && queue.isEmpty()) shutdown()
                      return START_NOT_STICKY
                  }
                  queue.addLast(url)
                  ensureEngine()
                  pump()
                  return START_NOT_STICKY
              }

              private fun ensureEngine() {
                  if (engine != null) return
                  val loader = FlutterInjector.instance().flutterLoader()
                  loader.startInitialization(applicationContext)
                  loader.ensureInitializationComplete(applicationContext, null)

                  val e = FlutterEngine(applicationContext)
                  val ch = MethodChannel(e.dartExecutor.binaryMessenger, "auto_saver/channel")
                  ch.setMethodCallHandler { call, result ->
                      when (call.method) {
                          "bgReady" -> {
                              ready = true
                              result.success(true)
                              pump()
                          }
                          "bgProgress" -> {
                              val text = call.argument<String>("text")
                              val pct = call.argument<Int>("progress") ?: -1
                              if (text != null) lastText = text
                              nm.notify(FG_ID, notif(lastText, pct, true))
                              result.success(true)
                          }
                          "bgDone" -> {
                              val ok = call.argument<Boolean>("ok") ?: false
                              val msg = call.argument<String>("message") ?: ""
                              result.success(true)
                              finishJob(ok, msg)
                          }
                          else -> if (!NativeBridge.handle(applicationContext, call, result)) result.notImplemented()
                      }
                  }
                  engine = e
                  channel = ch
                  ready = false
                  e.dartExecutor.executeDartEntrypoint(
                      DartExecutor.DartEntrypoint(loader.findAppBundlePath(), "backgroundMain")
                  )
              }

              private fun pump() {
                  if (running || queue.isEmpty() || !ready) return
                  running = true
                  val url = queue.removeFirst()
                  lastText = "جاري التحضير..."
                  nm.notify(FG_ID, notif(lastText, -1, true))
                  main.postDelayed(watchdog, 4 * 60 * 1000L)
                  channel?.invokeMethod("startJob", url)
              }

              private fun finishJob(ok: Boolean, msg: String) {
                  if (!running) return
                  running = false
                  main.removeCallbacks(watchdog)
                  nm.notify(FG_ID + 1 + (++resultCounter), notif(msg, -1, false, ok))
                  if (!ok) Haptics.failure(this)
                  if (queue.isEmpty()) shutdown() else {
                      ensureEngine()
                      pump()
                  }
              }

              private fun destroyEngine() {
                  try {
                      channel?.setMethodCallHandler(null)
                      engine?.destroy()
                  } catch (_: Exception) {}
                  engine = null
                  channel = null
                  ready = false
              }

              private fun shutdown() {
                  destroyEngine()
                  stopForegroundCompat()
                  stopSelf(lastStartId)
              }

              private fun createChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      nm.createNotificationChannel(
                          NotificationChannel(CHANNEL_ID, "التحميلات", NotificationManager.IMPORTANCE_LOW)
                      )
                  }
              }

              private fun notif(text: String, progress: Int, ongoing: Boolean, done: Boolean = false): Notification {
                  val b = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, CHANNEL_ID)
                  } else {
                      @Suppress("DEPRECATION")
                      Notification.Builder(this)
                  }
                  b.setContentTitle("محمّل الريلز الذكي")
                      .setContentText(text)
                      .setStyle(Notification.BigTextStyle().bigText(text))
                      .setSmallIcon(
                          if (done) android.R.drawable.stat_sys_download_done else android.R.drawable.stat_sys_download
                      )
                      .setOngoing(ongoing)
                      .setOnlyAlertOnce(true)
                      .setContentIntent(
                          PendingIntent.getActivity(
                              this, 0, Intent(this, MainActivity::class.java),
                              PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                          )
                      )
                  if (ongoing) b.setProgress(100, progress.coerceAtLeast(0), progress < 0) else b.setAutoCancel(true)
                  return b.build()
              }

              @Suppress("DEPRECATION")
              private fun stopForegroundCompat() {
                  stopForeground(true)
              }

              override fun onDestroy() {
                  main.removeCallbacks(watchdog)
                  destroyEngine()
                  super.onDestroy()
              }
          }
          EOF

          cat << 'EOF' > app_build/android/app/src/main/kotlin/com/autosaver/my_saver_app/NativeBridge.kt
          package com.autosaver.my_saver_app

          import android.annotation.SuppressLint
          import android.content.Context
          import android.media.MediaMetadataRetriever
          import android.os.Handler
          import android.os.Looper
          import android.webkit.JavascriptInterface
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import io.flutter.plugin.common.MethodCall
          import io.flutter.plugin.common.MethodChannel
          import java.io.File

          // الدوال الأصلية المشتركة بين واجهة التطبيق ومحرك الخلفية (Headless Flutter)
          object NativeBridge {
              private val main = Handler(Looper.getMainLooper())
              private var headlessWebView: WebView? = null

              fun handle(ctx: Context, call: MethodCall, result: MethodChannel.Result): Boolean {
                  when (call.method) {
                      "validateVideoFile" -> result.success(isPlayableVideoFile(call.argument<String>("path") ?: ""))
                      "saveToGallery" -> {
                          val path = call.argument<String>("path") ?: ""
                          Thread {
                              val ok = Gallery.save(ctx, path)
                              main.post { result.success(ok) }
                          }.start()
                      }
                      "vibrate" -> {
                          Haptics.vibrate(ctx, (call.argument<Int>("ms") ?: 200).toLong())
                          result.success(true)
                      }
                      "extractViaWebView" -> extractInstagramViaWebView(ctx, call.argument<String>("shortcode") ?: "", result)
                      else -> return false
                  }
                  return true
              }

              private fun isPlayableVideoFile(filePath: String): Boolean {
                  var retriever: MediaMetadataRetriever? = null
                  return try {
                      val file = File(filePath)
                      if (!file.exists() || file.length() < 150 * 1024) return false
                      retriever = MediaMetadataRetriever()
                      retriever.setDataSource(filePath)
                      val hasVideo = retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_HAS_VIDEO)
                      val width = retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_VIDEO_WIDTH)?.toIntOrNull() ?: 0
                      val duration = retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_DURATION)?.toLongOrNull() ?: 0L
                      (hasVideo == "yes" && width > 0 && duration > 400L)
                  } catch (e: Exception) {
                      false
                  } finally {
                      try { retriever?.release() } catch (_: Exception) {}
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              private fun extractInstagramViaWebView(ctx: Context, shortcode: String, result: MethodChannel.Result) {
                  if (shortcode.isEmpty()) {
                      result.success(null)
                      return
                  }
                  var isCompleted = false

                  fun finishWith(url: String?) {
                      if (!isCompleted) {
                          isCompleted = true
                          main.post {
                              try {
                                  headlessWebView?.stopLoading()
                                  headlessWebView?.destroy()
                                  headlessWebView = null
                              } catch (_: Exception) {}
                              result.success(url)
                          }
                      }
                  }

                  main.post {
                      try {
                          headlessWebView?.destroy()
                          val wv = WebView(ctx.applicationContext)
                          headlessWebView = wv
                          wv.settings.javaScriptEnabled = true
                          wv.settings.domStorageEnabled = true
                          wv.settings.mediaPlaybackRequiresUserGesture = false
                          wv.settings.mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                          wv.settings.userAgentString =
                              "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"

                          wv.addJavascriptInterface(object {
                              @JavascriptInterface
                              fun onVideoUrlFound(url: String?) {
                                  if (!url.isNullOrEmpty() && url.startsWith("http") && !url.contains("bytestart=")) {
                                      finishWith(url)
                                  }
                              }
                          }, "AndroidExtractor")

                          wv.webViewClient = object : WebViewClient() {
                              override fun onPageFinished(view: WebView?, url: String?) {
                                  super.onPageFinished(view, url)
                                  val js = """
                                      (async function() {
                                          try {
                                              function cleanStr(s) {
                                                  return s.replace(/\\\\\//g, '/')
                                                          .replace(/\\\//g, '/')
                                                          .replace(/\\u0026/g, '&')
                                                          .replace(/\\\\u0026/g, '&')
                                                          .replace(/\\"/g, '"')
                                                          .replace(/&amp;/g, '&');
                                              }

                                              var rawHtml = cleanStr(document.documentElement.innerHTML);
                                              var m1 = rawHtml.match(/"video_url"\s*:\s*"(https?:\/\/[^"]+)"/);
                                              if (m1 && m1[1] && m1[1].indexOf('bytestart=') === -1) {
                                                  AndroidExtractor.onVideoUrlFound(m1[1]);
                                                  return;
                                              }

                                              var lsdMatch = document.documentElement.innerHTML.match(/"LSD"\s*,\s*\[\]\s*,\s*\{\s*"token"\s*:\s*"([^"]+)"/);
                                              var lsd = lsdMatch ? lsdMatch[1] : 'AVqbxe3J_YA';
                                              var docIds = ['8845758582119845', '10015901848480474', '7153636648076553'];

                                              for (var i = 0; i < docIds.length; i++) {
                                                  try {
                                                      var body = 'av=0&__d=www&__user=0&__a=1&lsd=' + encodeURIComponent(lsd) +
                                                          '&variables=' + encodeURIComponent(JSON.stringify({shortcode: '$shortcode'})) +
                                                          '&doc_id=' + docIds[i];
                                                      var resp = await fetch('https://www.instagram.com/graphql/query', {
                                                          method: 'POST',
                                                          headers: {
                                                              'Content-Type': 'application/x-www-form-urlencoded',
                                                              'X-IG-App-ID': '936619743392459',
                                                              'X-FB-LSD': lsd,
                                                              'X-ASBD-ID': '129477'
                                                          },
                                                          body: body
                                                      });
                                                      var txt = cleanStr(await resp.text());
                                                      var mGql = txt.match(/"video_url"\s*:\s*"(https?:\/\/[^"]+)"/);
                                                      if (mGql && mGql[1]) {
                                                          AndroidExtractor.onVideoUrlFound(mGql[1]);
                                                          return;
                                                      }
                                                  } catch (e) {}
                                              }

                                              var btn = document.querySelector('.EmbedVideo, .WatchOnInstagram, button, div[role="button"]');
                                              if (btn) btn.click();
                                              for (var t = 0; t < 10; t++) {
                                                  await new Promise(r => setTimeout(r, 400));
                                                  var v = document.querySelector('video');
                                                  if (v && v.src && v.src.indexOf('http') === 0 && v.src.indexOf('bytestart=') === -1) {
                                                      AndroidExtractor.onVideoUrlFound(v.src);
                                                      return;
                                                  }
                                              }
                                          } catch (err) {}
                                      })();
                                  """.trimIndent()
                                  view?.evaluateJavascript(js, null)
                              }
                          }

                          wv.loadUrl("https://www.instagram.com/p/$shortcode/embed/captioned/")
                          main.postDelayed({ finishWith(null) }, 10000)
                      } catch (e: Exception) {
                          finishWith(null)
                      }
                  }
              }
          }
