          import 'package:youtube_explode_dart/youtube_explode_dart.dart';

          const MethodChannel kChannel = MethodChannel('auto_saver/channel');

          class DownloadedVideoItem {
            final String id;
            final String title;
            final String platform;
            final String filePath;
            final String date;
            final String sizeMb;

            DownloadedVideoItem({
              required this.id,
              required this.title,
              required this.platform,
              required this.filePath,
              required this.date,
              required this.sizeMb,
            });

            Map<String, dynamic> toJson() => {
                  'id': id,
                  'title': title,
                  'platform': platform,
                  'filePath': filePath,
                  'date': date,
                  'sizeMb': sizeMb,
                };

            factory DownloadedVideoItem.fromJson(Map<String, dynamic> json) =>
                DownloadedVideoItem(
                  id: json['id'] ?? '',
                  title: json['title'] ?? 'فيديو محمّل',
                  platform: json['platform'] ?? 'TikTok',
                  filePath: json['filePath'] ?? '',
                  date: json['date'] ?? '',
                  sizeMb: json['sizeMb'] ?? '0 MB',
                );
          }

          // مكتبة الفيديوهات: مشتركة بين واجهة التطبيق ومحرك الخلفية عبر SharedPreferences
          class LibraryStore {
            static const String _key = 'saved_videos_list';

            static Future<List<DownloadedVideoItem>> load() async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.reload();
              final saved = prefs.getStringList(_key) ?? [];
              final List<DownloadedVideoItem> out = [];
              for (final s in saved) {
                try {
                  final item = DownloadedVideoItem.fromJson(jsonDecode(s));
                  if (File(item.filePath).existsSync()) out.add(item);
                } catch (_) {}
              }
              return out;
            }

            static Future<void> _save(List<DownloadedVideoItem> list) async {
              final prefs = await SharedPreferences.getInstance();
              await prefs.setStringList(
                  _key, list.map((v) => jsonEncode(v.toJson())).toList());
            }

            static Future<void> add(DownloadedVideoItem item) async {
              final list = await load();
              list.insert(0, item);
              await _save(list);
            }

            static Future<void> remove(DownloadedVideoItem item) async {
              try {
                final f = File(item.filePath);
                if (await f.exists()) await f.delete();
              } catch (_) {}
              final list = await load();
              list.removeWhere((v) => v.id == item.id);
              await _save(list);
            }
          }

          class DownloadResult {
            final bool ok;
            final String message;
            DownloadResult(this.ok, this.message);
          }

          class ReelDownloader {
            final String customApi;
            final void Function(String) onStatus;
            final void Function(double) onProgress;
            late final Dio _dio;
            String? _ytTitle;

            ReelDownloader({
              required this.customApi,
              required this.onStatus,
              required this.onProgress,
            }) {
              _dio = Dio(BaseOptions(
                connectTimeout: const Duration(seconds: 15),
                receiveTimeout: const Duration(seconds: 35),
                validateStatus: (status) => status != null && status < 500,
                headers: {
                  'User-Agent':
                      'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',
                  'Accept': '*/*',
                  'Accept-Language': 'en-US,en;q=0.9,ar;q=0.8',
                },
              ));
            }

            static bool isSupported(String url) =>
                url.contains('tiktok.com') ||
                url.contains('instagram.com') ||
                url.contains('youtube.com') ||
                url.contains('youtu.be');

            // ============================ الدخول الرئيسي ============================
            Future<DownloadResult> download(String rawInput) async {
              final urlMatch = RegExp(r'https?://[^\s"<>]+').firstMatch(rawInput);
              final cleanUrl = urlMatch?.group(0) ?? rawInput.trim();

              if (!isSupported(cleanUrl)) {
                return DownloadResult(false,
                    "الرابط غير مدعوم، انسخ رابط TikTok أو Instagram أو YouTube.");
              }

              final bool isTikTok = cleanUrl.contains('tiktok.com');
              final bool isInsta = cleanUrl.contains('instagram.com');
              final String platform =
                  isTikTok ? 'TikTok' : (isInsta ? 'Instagram Reels' : 'YouTube');

              onProgress(0);
              onStatus("جاري استخراج وتنزيل الفيديو الكامل...");

              try {
                final appDir = await getApplicationDocumentsDirectory();
                final videosDir = Directory('${appDir.path}/downloaded_reels');
                if (!await videosDir.exists()) {
                  await videosDir.create(recursive: true);
                }

                final id = DateTime.now().millisecondsSinceEpoch.toString();
                final localFilePath = '${videosDir.path}/vid_$id.mp4';

                final bool success = isTikTok
                    ? await _downloadTikTokVerified(cleanUrl, localFilePath)
                    : (isInsta
                        ? await _downloadInstagramVerified(cleanUrl, localFilePath)
                        : await _downloadYouTubeVerified(cleanUrl, localFilePath));

                if (!success) {
                  throw Exception(
                      "تعذر الحصول على ملف فيديو صالح من جميع المحركات. أضف رابط خادمك الخاص (yt-dlp) من التطبيق لضمان العمل دائماً.");
                }

                try {
                  await kChannel.invokeMethod('saveToGallery', {'path': localFilePath});
                } catch (_) {}

                final fileBytes = await File(localFilePath).length();
                final sizeMb = "${(fileBytes / (1024 * 1024)).toStringAsFixed(1)} MB";
                final now = DateTime.now();
                final dateStr =
                    "${now.year}/${now.month.toString().padLeft(2, '0')}/${now.day.toString().padLeft(2, '0')} - ${now.hour}:${now.minute.toString().padLeft(2, '0')}";

                final shortcode = _extractIgShortcodeFromText(cleanUrl) ?? id;
                final title = isTikTok
                    ? "فيديو تيك توك بدون علامة"
                    : (isInsta ? "فيديو ريلز ($shortcode)" : (_ytTitle ?? "فيديو يوتيوب"));

                await LibraryStore.add(DownloadedVideoItem(
                  id: id,
                  title: title,
                  platform: platform,
                  filePath: localFilePath,
                  date: dateStr,
                  sizeMb: sizeMb,
                ));

                try {
                  await kChannel.invokeMethod('vibrate', {'ms': 300});
                } catch (_) {}
                return DownloadResult(
                    true, "تم تنزيل الفيديو الكامل ($sizeMb) وحفظه في المعرض ✓");
              } catch (e) {
                return DownloadResult(
                    false, "تعذر التحميل: ${e.toString().replaceAll('Exception: ', '')}");
              }
            }

            // ============================ أدوات مشتركة ============================
            String? _extractIgShortcodeFromText(String input) {
              final decoded = Uri.decodeFull(input);
              final reg = RegExp(
                r'instagram\.com/(?!share/)(?:[A-Za-z0-9_.-]+/)?(?:reel|reels|p|tv)/([A-Za-z0-9_-]+)',
                caseSensitive: false,
              );
              final match = reg.firstMatch(decoded);
              if (match != null && match.group(1) != null) return match.group(1);
              final fallback =
                  RegExp(r'/(?:reel|reels|p|tv)/([A-Za-z0-9_-]{6,})').firstMatch(decoded);
              if (fallback != null && !decoded.contains('/share/')) {
                return fallback.group(1);
              }
              return null;
            }

            Future<String?> _resolveShareLinkShortcode(String url) async {
              final directCode = _extractIgShortcodeFromText(url);
              if (directCode != null) return directCode;

              try {
                String currentUrl = url;
                for (int i = 0; i < 6; i++) {
                  final client = HttpClient();
                  client.connectionTimeout = const Duration(seconds: 8);
                  client.userAgent =
                      'facebookexternalhit/1.1 (+http://www.facebook.com/externalhit_uatext.php)';
                  final req = await client.getUrl(Uri.parse(currentUrl));
                  req.followRedirects = false;
                  final res = await req.close();
                  final loc = res.headers.value(HttpHeaders.locationHeader);
                  client.close(force: true);

                  if (loc == null || loc.isEmpty) break;
                  final fullLoc =
                      loc.startsWith('http') ? loc : 'https://www.instagram.com$loc';
                  final code = _extractIgShortcodeFromText(fullLoc);
                  if (code != null) return code;
                  if (fullLoc.contains('/accounts/login')) break;
                  currentUrl = fullLoc;
                }
              } catch (_) {}
              return null;
            }

            List<String> _extractAllValidVideoUrls(String raw) {
              final List<String> results = [];
              final norm = raw
                  .replaceAll(r'\\/', '/')
                  .replaceAll(r'\/', '/')
                  .replaceAll(r'\\u0026', '&')
                  .replaceAll(r'\u0026', '&')
                  .replaceAll(r'\"', '"')
                  .replaceAll('&amp;', '&');

              void addCandidate(String? u) {
                if (u == null) return;
                final clean = u.trim();
                if (!clean.startsWith('http')) return;
                if (clean.contains('static.cdninstagram.com')) return;
                if (clean.contains('bytestart=')) return;
                if (clean.contains('.jpg') ||
                    clean.contains('.jpeg') ||
                    clean.contains('.png') ||
                    clean.contains('.webp') ||
                    clean.contains('.js') ||
                    clean.contains('.css')) return;
                if (!results.contains(clean)) results.add(clean);
              }

              for (final m
                  in RegExp(r'"video_url"\s*:\s*"(https?://[^"]+)"').allMatches(norm)) {
                addCandidate(m.group(1));
              }
              for (final m in RegExp(
                      r'"video_versions"\s*:\s*\[\s*\{[^}]*"url"\s*:\s*"(https?://[^"]+)"')
                  .allMatches(norm)) {
                addCandidate(m.group(1));
              }
              for (final m
                  in RegExp(r'<video[^>]+src="(https?://[^"]+)"').allMatches(norm)) {
                addCandidate(m.group(1));
              }
              for (final m in RegExp(
                r'"(?:url|hdplay|play|noWatermark|video)"\s*:\s*"(https?://[^"]+)"',
                caseSensitive: false,
              ).allMatches(norm)) {
                final c = m.group(1)!;
                if (!c.contains('instagram.com/reel/') && !c.contains('instagram.com/p/')) {
                  addCandidate(c);
                }
              }
              return results;
            }

            Future<String?> _extractViaPubler(String cleanUrl) async {
              try {
                final initRes = await _dio.post(
                  'https://app.publer.io/hooks/media',
                  data: jsonEncode({'url': cleanUrl, 'iphone': false}),
                  options: Options(
                    headers: {
                      'Content-Type': 'application/json',
                      'Origin': 'https://publer.io',
                      'Referer': 'https://publer.io/',
                    },
                  ),
                );
                final initMap =
                    initRes.data is String ? jsonDecode(initRes.data) : initRes.data;
                final jobId = initMap['job_id']?.toString();
                if (jobId == null || jobId.isEmpty) return null;

                for (int i = 0; i < 7; i++) {
                  await Future.delayed(const Duration(milliseconds: 1200));
                  final pollRes = await _dio.get(
                    'https://app.publer.io/api/v1/job_status/$jobId',
                    options: Options(headers: {
                      'Origin': 'https://publer.io',
                      'Referer': 'https://publer.io/',
                    }),
                  );
                  final pollMap =
                      pollRes.data is String ? jsonDecode(pollRes.data) : pollRes.data;
                  if (pollMap['status'] == 'complete') {
                    final payload = pollMap['payload'];
                    if (payload is List && payload.isNotEmpty) {
                      final path = payload[0]['path']?.toString();
                      if (path != null && path.startsWith('http')) return path;
                    }
                    break;
                  }
                }
              } catch (_) {}
              return null;
            }

            // خادم yt-dlp الخاص: الطريقة الأكثر ثباتاً على المدى الطويل
            Future<String?> _tryCustomServer(String targetUrl) async {
              final base = customApi.trim();
              if (base.isEmpty) return null;
              try {
                final sep = base.contains('?') ? '&' : '?';
                final res = await _dio.get(
                  '$base${sep}url=${Uri.encodeComponent(targetUrl)}',
                );
                if (res.data is String) {
                  final t = (res.data as String).trim();
                  if (t.startsWith('http')) return t;
                }
                dynamic data = res.data;
                try {
                  data = res.data is String ? jsonDecode(res.data) : res.data;
                } catch (_) {}
                String? candidate;
                void dig(dynamic d) {
                  if (candidate != null || d == null) return;
                  if (d is Map) {
                    for (final k in [
                      'url', 'video', 'video_url', 'hdplay', 'play', 'download', 'link'
                    ]) {
                      final v = d[k];
                      if (v is String &&
                          v.startsWith('http') &&
                          !v.contains('.jpg') &&
                          !v.contains('.png')) {
                        candidate = v;
                        return;
                      }
                    }
                    d.forEach((_, v) => dig(v));
                  } else if (d is List) {
                    for (final v in d) {
                      dig(v);
                    }
                  }
                }

                dig(data);
                return candidate;
              } catch (_) {}
              return null;
            }

            Future<bool> _validate(String path) async {
              try {
                return await kChannel
                        .invokeMethod<bool>('validateVideoFile', {'path': path}) ??
                    false;
              } catch (_) {
                return false;
              }
            }

            Future<bool> _tryDownloadAndVerifyVideo(
              String candidateUrl,
              String savePath,
              bool isTikTok,
              String engineName,
            ) async {
              try {
                final f = File(savePath);
                if (await f.exists()) await f.delete();

                onStatus("جاري التحميل عبر محرك: $engineName");

                await _dio.download(
                  candidateUrl,
                  savePath,
                  options: Options(
                    headers: {
                      'Referer': engineName.contains('tikwm')
                          ? 'https://www.tikwm.com/'
                          : (isTikTok
                              ? 'https://www.tiktok.com/'
                              : 'https://www.instagram.com/'),
                      'Accept': '*/*',
                    },
                  ),
                  onReceiveProgress: (rec, total) {
                    if (total > 150000) onProgress(rec / total);
                  },
                );

                if (!await _validate(savePath)) {
                  if (await f.exists()) await f.delete();
                  onStatus("فشل محرك $engineName (ملف غير صالح)، جارٍ تجربة المحرك التالي...");
                  return false;
                }
                return true;
              } catch (e) {
                final f = File(savePath);
                if (await f.exists()) await f.delete();
                onStatus(
                    "فشل محرك $engineName (${e.toString().split('\n').first})، جارٍ تجربة المحرك التالي...");
                return false;
              }
            }

            // ============================ تيك توك ============================
            Future<bool> _downloadTikTokVerified(String url, String savePath) async {
              final custom = await _tryCustomServer(url);
              if (custom != null &&
                  await _tryDownloadAndVerifyVideo(custom, savePath, true, 'الخادم الخاص')) {
                return true;
              }

              try {
                final res = await _dio.post(
                  'https://www.tikwm.com/api/',
                  data: {'url': url, 'hd': 1},
                  options: Options(contentType: Headers.formUrlEncodedContentType),
                );
                final dataMap = res.data is String ? jsonDecode(res.data) : res.data;
                if (dataMap is Map && dataMap['code'] == 0) {
                  final d = dataMap['data'];
                  for (final key in ['hdplay', 'play', 'wmplay']) {
                    String? u = d[key]?.toString();
                    if (u != null && u.isNotEmpty) {
                      if (u.startsWith('/')) u = 'https://www.tikwm.com$u';
                      if (await _tryDownloadAndVerifyVideo(u, savePath, true, 'tikwm')) {
                        return true;
                      }
                    }
                  }
                }
              } catch (_) {}

              final publerUrl = await _extractViaPubler(url);
              if (publerUrl != null &&
