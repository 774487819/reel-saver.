          package com.autosaver.my_saver_app

          import android.content.ContentValues
          import android.content.Context
          import android.media.MediaScannerConnection
          import android.os.Build
          import android.os.Environment
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.provider.MediaStore
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream

          object Library {
              private const val FILE = "library.json"

              @Synchronized
              fun load(ctx: Context): JSONArray {
                  val f = File(ctx.filesDir, FILE)
                  if (!f.exists()) return JSONArray()
                  return try {
                      val old = JSONArray(f.readText())
                      val arr = JSONArray()
                      for (i in 0 until old.length()) {
                          val o = old.getJSONObject(i)
                          if (File(o.optString("filePath")).exists()) arr.put(o)
                      }
                      arr
                  } catch (e: Exception) {
                      JSONArray()
                  }
              }

              @Synchronized
              fun add(ctx: Context, item: JSONObject) {
                  val old = load(ctx)
                  val arr = JSONArray()
                  arr.put(item)
                  for (i in 0 until old.length()) arr.put(old.get(i))
                  File(ctx.filesDir, FILE).writeText(arr.toString())
              }

              @Synchronized
              fun remove(ctx: Context, id: String) {
                  val old = load(ctx)
                  val arr = JSONArray()
                  for (i in 0 until old.length()) {
                      val o = old.getJSONObject(i)
                      if (o.optString("id") == id) {
                          try { File(o.optString("filePath")).delete() } catch (_: Exception) {}
                      } else {
                          arr.put(o)
                      }
                  }
                  File(ctx.filesDir, FILE).writeText(arr.toString())
              }
          }

          object Gallery {
              fun save(ctx: Context, filePath: String): Boolean {
                  return try {
                      val src = File(filePath)
                      if (!src.exists()) return false
                      val fileName = "Reel_${System.currentTimeMillis()}.mp4"

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          val values = ContentValues().apply {
                              put(MediaStore.Video.Media.DISPLAY_NAME, fileName)
                              put(MediaStore.Video.Media.MIME_TYPE, "video/mp4")
                              put(MediaStore.Video.Media.RELATIVE_PATH, Environment.DIRECTORY_MOVIES + "/AutoReelSaver")
                              put(MediaStore.Video.Media.IS_PENDING, 1)
                          }
                          val resolver = ctx.contentResolver
                          val uri = resolver.insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, values) ?: return false
                          resolver.openOutputStream(uri)?.use { out ->
                              FileInputStream(src).use { it.copyTo(out) }
                          }
                          values.clear()
                          values.put(MediaStore.Video.Media.IS_PENDING, 0)
                          resolver.update(uri, values, null, null)
                          true
                      } else {
                          @Suppress("DEPRECATION")
                          val movies = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_MOVIES)
                          val dir = File(movies, "AutoReelSaver")
                          if (!dir.exists()) dir.mkdirs()
                          val dest = File(dir, fileName)
                          FileInputStream(src).use { i -> FileOutputStream(dest).use { o -> i.copyTo(o) } }
                          MediaScannerConnection.scanFile(ctx, arrayOf(dest.absolutePath), arrayOf("video/mp4"), null)
                          true
                      }
                  } catch (e: Exception) {
                      false
                  }
              }
          }

          object Haptics {
              @Suppress("DEPRECATION")
              fun vibrate(ctx: Context, ms: Long) {
                  try {
                      val v = ctx.getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          v.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE))
                      } else {
                          v.vibrate(ms)
                      }
                  } catch (_: Exception) {}
              }

              @Suppress("DEPRECATION")
              fun failure(ctx: Context) {
                  try {
                      val v = ctx.getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                      val pattern = longArrayOf(0, 80, 90, 80)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          v.vibrate(VibrationEffect.createWaveform(pattern, -1))
                      } else {
                          v.vibrate(pattern, -1)
                      }
                  } catch (_: Exception) {}
              }
          }
