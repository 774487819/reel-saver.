name: Build Auto Reel Saver APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter Project & Install Packages
        run: |
          flutter create -a kotlin --org com.autosaver --project-name my_saver_app app_build
          cd app_build
          flutter pub add dio shared_preferences path_provider video_player

      - name: Configure Android XML & Manifest
        run: |
          mkdir -p app_build/android/app/src/main/res/xml
          mkdir -p app_build/android/app/src/main/res/values

          cat << 'EOF' > app_build/android/app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">محمّل الريلز الذكي</string>
              <string name="acc_desc">محرك النقر الخلفي لنسخ وتحميل فيديوهات الريلز والتيك توك تلقائياً بدون علامة مائية</string>
          </resources>
          EOF

          cat << 'EOF' > app_build/android/app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds|flagRetrieveInteractiveWindows"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:description="@string/acc_desc"
              android:notificationTimeout="100" />
          EOF

          cat << 'EOF' > app_build/android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.HIGH_SAMPLING_RATE_SENSORS"/>

              <application
                  android:label="@string/app_name"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleInstance"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".AutoReelGrabberService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF

      - name: Write Native Kotlin Engine (MainActivity.kt)
        run: |
          mkdir -p app_build/android/app/src/main/kotlin/com/autosaver/my_saver_app
          cat << 'EOF' > app_build/android/app/src/main/kotlin/com/autosaver/my_saver_app/MainActivity.kt
          package com.autosaver.my_saver_app

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.ClipboardManager
          import android.content.ContentValues
          import android.content.Context
          import android.content.Intent
          import android.graphics.Path
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.media.MediaScannerConnection
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import android.os.Handler
          import android.os.Looper
          import android.os.VibrationEffect
          import android.os.Vibrator
          import android.provider.MediaStore
          import android.provider.Settings
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import kotlin.math.abs

          class MainActivity : FlutterActivity() {
              private val CHANNEL = "auto_saver/channel"
              private var methodChannel: MethodChannel? = null
              private var waitingForClipboardFocus = false

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  methodChannel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL)

                  methodChannel?.setMethodCallHandler { call, result ->
                      when (call.method) {
                          "openAccessibilitySettings" -> {
                              val intent = Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
                              intent.flags = Intent.FLAG_ACTIVITY_NEW_TASK
                              startActivity(intent)
                              result.success(true)
                          }
                          "requestOverlayPermission" -> {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                                  val intent = Intent(
                                      Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                      Uri.parse("package:$packageName")
                                  )
                                  startActivity(intent)
                              }
                              result.success(true)
                          }
                          "checkPermissions" -> {
                              val acc = isServiceEnabled()
                              val overlay = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                  Settings.canDrawOverlays(this)
                              } else true
                              result.success(mapOf("accessibility" to acc, "overlay" to overlay))
                          }
                          "updateSensitivity" -> {
                              val value = call.argument<Double>("value") ?: 11.5
                              getSharedPreferences("auto_saver_prefs", Context.MODE_PRIVATE)
                                  .edit()
                                  .putFloat("sensitivity", value.toFloat())
                                  .apply()
                              result.success(true)
                          }
                          "saveToGallery" -> {
                              val path = call.argument<String>("path") ?: ""
                              val saved = saveVideoToGallery(path)
                              result.success(saved)
                          }
                          "vibrate" -> {
                              val ms = call.argument<Int>("ms") ?: 200
                              vibrateDevice(ms.toLong())
                              result.success(true)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              override fun onNewIntent(intent: Intent) {
                  super.onNewIntent(intent)
                  setIntent(intent)
                  if (intent.getBooleanExtra("auto_copied", false)) {
                      waitingForClipboardFocus = true
                  }
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus && (waitingForClipboardFocus || intent?.getBooleanExtra("auto_copied", false) == true)) {
                      waitingForClipboardFocus = false
                      intent?.removeExtra("auto_copied")

                      Handler(Looper.getMainLooper()).postDelayed({
                          val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          val clipText = clipboard.primaryClip?.getItemAt(0)?.text?.toString() ?: ""

                          moveTaskToBack(true)

                          if (clipText.isNotEmpty()) {
                              methodChannel?.invokeMethod("onAutoLinkCaptured", clipText)
                          }
                      }, 150)
                  }
              }

              private fun saveVideoToGallery(filePath: String): Boolean {
                  return try {
                      val srcFile = File(filePath)
                      if (!srcFile.exists()) return false
                      val fileName = "Reel_${System.currentTimeMillis()}.mp4"

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          val values = ContentValues().apply {
                              put(MediaStore.Video.Media.DISPLAY_NAME, fileName)
                              put(MediaStore.Video.Media.MIME_TYPE, "video/mp4")
                              put(MediaStore.Video.Media.RELATIVE_PATH, Environment.DIRECTORY_MOVIES + "/AutoReelSaver")
                              put(MediaStore.Video.Media.IS_PENDING, 1)
                          }
                          val resolver = applicationContext.contentResolver
                          val uri = resolver.insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, values) ?: return false
                          resolver.openOutputStream(uri)?.use { outStream ->
                              FileInputStream(srcFile).use { inStream ->
                                  inStream.copyTo(outStream)
                              }
                          }
                          values.clear()
                          values.put(MediaStore.Video.Media.IS_PENDING, 0)
                          resolver.update(uri, values, null, null)
                          true
                      } else {
                          val moviesDir = Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_MOVIES)
                          val appDir = File(moviesDir, "AutoReelSaver")
                          if (!appDir.exists()) appDir.mkdirs()
                          val destFile = File(appDir, fileName)
                          FileInputStream(srcFile).use { inStream ->
                              FileOutputStream(destFile).use { outStream ->
                                  inStream.copyTo(outStream)
                              }
                          }
                          MediaScannerConnection.scanFile(this, arrayOf(destFile.absolutePath), arrayOf("video/mp4"), null)
                          true
                      }
                  } catch (e: Exception) {
                      false
                  }
              }

              private fun vibrateDevice(durationMs: Long) {
                  val vibrator = getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      vibrator.vibrate(VibrationEffect.createOneShot(durationMs, VibrationEffect.DEFAULT_AMPLITUDE))
                  } else {
                      @Suppress("DEPRECATION")
                      vibrator.vibrate(durationMs)
                  }
              }

              private fun isServiceEnabled(): Boolean {
                  val expected = "$packageName/${AutoReelGrabberService::class.java.canonicalName}"
                  val enabledServices = Settings.Secure.getString(
                      contentResolver,
                      Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return false
                  return enabledServices.contains(expected)
              }
          }

          class AutoReelGrabberService : AccessibilityService(), SensorEventListener {
              private var sensorManager: SensorManager? = null
              private var firstTapTime: Long = 0
              private var lastActionTime: Long = 0
              private val handler = Handler(Looper.getMainLooper())

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  sensorManager = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  val sensor = sensorManager?.getDefaultSensor(Sensor.TYPE_LINEAR_ACCELERATION)
                  sensorManager?.registerListener(this, sensor, SensorManager.SENSOR_DELAY_GAME)
              }

              override fun onSensorChanged(event: SensorEvent?) {
                  if (event == null) return
                  val prefs = getSharedPreferences("auto_saver_prefs", Context.MODE_PRIVATE)
                  val sensitivity = prefs.getFloat("sensitivity", 11.5f)

                  val x = abs(event.values[0])
                  val y = abs(event.values[1])
                  val z = abs(event.values[2])

                  if (z > sensitivity && x < 6.0f && y < 6.0f) {
                      val now = System.currentTimeMillis()
                      if (now - lastActionTime < 5000) return

                      if (now - firstTapTime > 500) {
                          firstTapTime = now
                      } else {
                          val diff = now - firstTapTime
                          if (diff in 120..500) {
                              firstTapTime = 0
                              lastActionTime = now
                              executeAutoShareAndCopy()
                          }
                      }
                  }
              }

              private fun executeAutoShareAndCopy() {
                  vibrateShort(120)

                  val root = rootInActiveWindow ?: return
                  val shareWords = listOf("مشاركة", "إرسال", "Share", "Send", "share")
                  val clickedShare = findAndClickNode(root, shareWords)

                  if (!clickedShare) {
                      tapCoordinates(0.91f, 0.72f)
                  }

                  handler.postDelayed({
                      val currentRoot = rootInActiveWindow
                      val copyWords = listOf("نسخ الرابط", "نسخ", "Copy link", "Copy URL", "copy")
                      if (currentRoot != null) {
                          findAndClickNode(currentRoot, copyWords)
                      }

                      handler.postDelayed({
                          val launchIntent = Intent(this, MainActivity::class.java).apply {
                              addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                              putExtra("auto_copied", true)
                          }
                          startActivity(launchIntent)
                      }, 550)
                  }, 950)
              }

              private fun findAndClickNode(node: AccessibilityNodeInfo, keywords: List<String>): Boolean {
                  val text = node.text?.toString() ?: ""
                  val desc = node.contentDescription?.toString() ?: ""
                  val viewId = node.viewIdResourceName ?: ""

                  for (word in keywords) {
                      if (text.contains(word, ignoreCase = true) ||
                          desc.contains(word, ignoreCase = true) ||
                          viewId.contains(word, ignoreCase = true)
                      ) {
                          if (clickClickableParent(node)) return true
                      }
                  }

                  for (i in 0 until node.childCount) {
                      val child = node.getChild(i) ?: continue
                      if (findAndClickNode(child, keywords)) return true
                  }
                  return false
              }

              private fun clickClickableParent(node: AccessibilityNodeInfo?): Boolean {
                  var current = node
                  while (current != null) {
                      if (current.isClickable) {
                          return current.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                      }
                      current = current.parent
                  }
                  return false
              }

              private fun tapCoordinates(xRatio: Float, yRatio: Float) {
                  val metrics = resources.displayMetrics
                  val path = Path().apply {
                      moveTo(metrics.widthPixels * xRatio, metrics.heightPixels * yRatio)
                  }
                  val gesture = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, 80))
                      .build()
                  dispatchGesture(gesture, null, null)
              }

              private fun vibrateShort(ms: Long) {
                  val vibrator = getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      vibrator.vibrate(VibrationEffect.createOneShot(ms, VibrationEffect.DEFAULT_AMPLITUDE))
                  } else {
                      @Suppress("DEPRECATION")
                      vibrator.vibrate(ms)
                  }
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}
          }
          EOF

      - name: Write Multi-Engine Flutter Extractor & UI (lib/main.dart)
        run: |
          cat << 'EOF' > app_build/lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:dio/dio.dart';
          import 'package:path_provider/path_provider.dart';
          import 'package:shared_preferences/shared_preferences.dart';
          import 'package:video_player/video_player.dart';

          const String kDeveloperName = "تطوير: [اكتب اسمك هنا]";
          const String kAppTitle = "محمّل الريلز والتيك توك الذكي";

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const AutoReelSaverApp());
          }

          class DownloadedVideoItem {
            final String id;
            final String title;
            final String platform;
            final String filePath;
            final String date;
            final String sizeMb;

            DownloadedVideoItem({
              required this.id,
              required this.title,
              required this.platform,
              required this.filePath,
              required this.date,
              required this.sizeMb,
            });

            Map<String, dynamic> toJson() => {
                  'id': id,
                  'title': title,
                  'platform': platform,
                  'filePath': filePath,
                  'date': date,
                  'sizeMb': sizeMb,
                };

            factory DownloadedVideoItem.fromJson(Map<String, dynamic> json) =>
                DownloadedVideoItem(
                  id: json['id'] ?? '',
                  title: json['title'] ?? 'فيديو محمّل',
                  platform: json['platform'] ?? 'TikTok',
                  filePath: json['filePath'] ?? '',
                  date: json['date'] ?? '',
                  sizeMb: json['sizeMb'] ?? '0 MB',
                );
          }

          class AutoReelSaverApp extends StatelessWidget {
            const AutoReelSaverApp({super.key});

            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: kAppTitle,
                debugShowCheckedModeBanner: false,
                theme: ThemeData.dark().copyWith(
                  scaffoldBackgroundColor: const Color(0xFF090D16),
                  colorScheme: const ColorScheme.dark(
                    primary: Color(0xFF00F2FE),
                    secondary: Color(0xFF4FACFE),
                  ),
                ),
                home: const MainDashboard(),
              );
            }
          }

          class MainDashboard extends StatefulWidget {
            const MainDashboard({super.key});

            @override
            State<MainDashboard> createState() => _MainDashboardState();
          }

          class _MainDashboardState extends State<MainDashboard>
              with WidgetsBindingObserver {
            static const MethodChannel _channel = MethodChannel('auto_saver/channel');
            late final Dio _dio;
            final TextEditingController _manualUrlController = TextEditingController();

            int _selectedTabIndex = 0;
            bool _isAccEnabled = false;
            bool _isOverlayEnabled = false;
            bool _isDownloading = false;
            double _progress = 0.0;
            double _sensitivity = 11.5;
            String _statusText =
                "تصفح تيك توك أو ريلز وانقر مرتين خلف الهاتف للنسخ والتحميل التلقائي";
            List<DownloadedVideoItem> _downloadedVideos = [];

            @override
            void initState() {
              super.initState();
              WidgetsBinding.instance.addObserver(this);
              _dio = Dio(BaseOptions(
                connectTimeout: const Duration(seconds: 20),
                receiveTimeout: const Duration(seconds: 40),
                headers: {
                  'User-Agent':
                      'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36',
                },
              ));
              _loadInitialData();

              _channel.setMethodCallHandler((call) async {
                if (call.method == "onAutoLinkCaptured") {
                  final String copiedUrl = call.arguments as String? ?? "";
                  if (copiedUrl.isNotEmpty) {
                    _manualUrlController.text = copiedUrl;
                    await _startVideoDownload(copiedUrl);
                  }
                }
              });
            }

            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              _manualUrlController.dispose();
              super.dispose();
            }

            @override
            void didChangeAppLifecycleState(AppLifecycleState state) {
              if (state == AppLifecycleState.resumed) {
                _checkPermissions();
              }
            }

            Future<void> _loadInitialData() async {
              await _checkPermissions();
              final prefs = await SharedPreferences.getInstance();
              final savedList = prefs.getStringList('saved_videos_list') ?? [];
              final List<DownloadedVideoItem> loaded = [];

              for (final itemStr in savedList) {
                try {
                  final item = DownloadedVideoItem.fromJson(jsonDecode(itemStr));
                  if (File(item.filePath).existsSync()) {
                    loaded.add(item);
                  }
                } catch (_) {}
              }

              setState(() {
                _sensitivity = prefs.getDouble('tap_sensitivity') ?? 11.5;
                _downloadedVideos = loaded;
              });
            }

            Future<void> _checkPermissions() async {
              try {
                final res = await _channel.invokeMethod<Map>('checkPermissions');
                if (res != null) {
                  setState(() {
                    _isAccEnabled = res['accessibility'] == true;
                    _isOverlayEnabled = res['overlay'] == true;
                  });
                }
              } catch (_) {}
            }

            Future<void> _saveVideoListToStorage() async {
              final prefs = await SharedPreferences.getInstance();
              final encoded =
                  _downloadedVideos.map((v) => jsonEncode(v.toJson())).toList();
              await prefs.setStringList('saved_videos_list', encoded);
            }

            // ==========================================================
            // فك الروابط المختصرة مثل /share/reel/ و vt.tiktok.com
            // ==========================================================
            Future<String> _resolveRedirectUrl(String url) async {
              try {
                final client = HttpClient();
                client.userAgent =
                    'Mozilla/5.0 (Linux; Android 13; SM-S918B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36';
                final req = await client.getUrl(Uri.parse(url));
                req.followRedirects = true;
                req.maxRedirects = 6;
                final res = await req.close();
                final finalUri = res.redirects.isNotEmpty
                    ? res.redirects.last.location.toString()
                    : url;
                client.close(force: true);
                if (finalUri.startsWith('http')) return finalUri;
              } catch (_) {}
              return url;
            }

            // ==========================================================
            // محرك استخراج تيك توك متعدد الخوادم
            // ==========================================================
            Future<Map<String, String>?> _extractTikTok(String url) async {
              // المحرك 1: TikWM HD
              try {
                final res = await _dio.post(
                  'https://www.tikwm.com/api/',
                  data: {'url': url, 'hd': 1},
                  options:
                      Options(contentType: Headers.formUrlEncodedContentType),
                );
                final dataMap =
                    res.data is String ? jsonDecode(res.data) : res.data;
                if (dataMap is Map && dataMap['code'] == 0) {
                  final d = dataMap['data'];
                  String? playUrl =
                      (d['hdplay'] ?? d['play'] ?? d['wmplay'])?.toString();
                  if (playUrl != null && playUrl.isNotEmpty) {
                    if (playUrl.startsWith('/')) {
                      playUrl = 'https://www.tikwm.com$playUrl';
                    }
                    final title =
                        d['title']?.toString().trim() ?? 'فيديو تيك توك';
                    return {
                      'url': playUrl,
                      'title': title.isEmpty ? 'فيديو تيك توك' : title
                    };
                  }
                }
              } catch (_) {}

              // المحرك 2: TiklyDown Fallback
              try {
                final res = await _dio.get(
                  'https://api.tiklydown.eu.org/api/download',
                  queryParameters: {'url': url},
                );
                final dataMap =
                    res.data is String ? jsonDecode(res.data) : res.data;
                final videoUrl = dataMap['video']?['noWatermark']?.toString() ??
                    dataMap['video']?['watermark']?.toString();
                if (videoUrl != null && videoUrl.startsWith('http')) {
                  return {
                    'url': videoUrl,
                    'title': dataMap['title']?.toString() ?? 'فيديو تيك توك',
                  };
                }
              } catch (_) {}

              // المحرك 3: Siputzx TikTok Fallback
              try {
                final res = await _dio.get(
                  'https://api.siputzx.my.id/api/d/tiktok',
                  queryParameters: {'url': url},
                );
                final dataMap =
                    res.data is String ? jsonDecode(res.data) : res.data;
                final urls = dataMap['data']?['urls'];
                if (urls is List && urls.isNotEmpty) {
                  return {
                    'url': urls.first.toString(),
                    'title': 'فيديو تيك توك بدون علامة',
                  };
                }
              } catch (_) {}

              return null;
            }

            // ==========================================================
            // محرك استخراج انستغرام ريلز (5 محركات مدمجة)
            // ==========================================================
            Future<Map<String, String>?> _extractInstagram(String rawUrl) async {
              final resolvedUrl = await _resolveRedirectUrl(rawUrl);
              final match = RegExp(r'/(?:reel|reels|p|tv)/([A-Za-z0-9_-]+)')
                  .firstMatch(resolvedUrl);
              final shortcode = match?.group(1);

              // المحرك 1: استخراج مباشر عبر Instagram GraphQL API
              if (shortcode != null) {
                for (final docId in ['8845758582119845', '10015901848480474']) {
                  try {
                    final res = await _dio.post(
                      'https://www.instagram.com/graphql/query',
                      data: {
                        'variables': jsonEncode({'shortcode': shortcode}),
                        'doc_id': docId,
                      },
                      options: Options(
                        contentType: Headers.formUrlEncodedContentType,
                        headers: {
                          'X-IG-App-ID': '936619743392459',
                          'X-ASBD-ID': '129477',
                          'X-IG-WWW-Claim': '0',
                          'Origin': 'https://www.instagram.com',
                          'Referer':
                              'https://www.instagram.com/reel/$shortcode/',
                        },
                      ),
                    );
                    final map =
                        res.data is String ? jsonDecode(res.data) : res.data;
                    final media = map['data']?['xdt_shortcode_media'] ??
                        map['data']?['shortcode_media'];
                    final videoUrl = media?['video_url']?.toString();
                    if (videoUrl != null && videoUrl.startsWith('http')) {
                      return {
                        'url': videoUrl,
                        'title': 'فيديو ريلز انستغرام ($shortcode)',
                      };
                    }
                  } catch (_) {}
                }

                // المحرك 2: استخراج مباشر من صفحة Embed الرسمية لإنستغرام
                try {
                  final res = await _dio.get(
                    'https://www.instagram.com/p/$shortcode/embed/captioned/',
                    options: Options(responseType: ResponseType.plain),
                  );
                  final html = res.data.toString();
                  final reg = RegExp(r'"video_url"\s*:\s*"([^"]+)"');
                  final m = reg.firstMatch(html);
                  if (m != null && m.group(1) != null) {
                    String cleanVideoUrl = m
                        .group(1)!
                        .replaceAll(r'\/', '/')
                        .replaceAll(r'\u0026', '&')
                        .replaceAll('&amp;', '&');
                    if (cleanVideoUrl.startsWith('http')) {
                      return {
                        'url': cleanVideoUrl,
                        'title': 'فيديو ريلز انستغرام ($shortcode)',
                      };
                    }
                  }
                } catch (_) {}
              }

              // المحرك 3: خادم Siputzx IGDL
              try {
                final res = await _dio.get(
                  'https://api.siputzx.my.id/api/d/igdl',
                  queryParameters: {'url': resolvedUrl},
                );
                final map =
                    res.data is String ? jsonDecode(res.data) : res.data;
                final dataList = map['data'];
                if (dataList is List && dataList.isNotEmpty) {
                  final vUrl = dataList.first['url']?.toString();
                  if (vUrl != null && vUrl.startsWith('http')) {
                    return {'url': vUrl, 'title': 'فيديو ريلز انستغرام'};
                  }
                }
              } catch (_) {}

              // المحرك 4: خادم Ryzendesu IGDL
              try {
                final res = await _dio.get(
                  'https://api.ryzendesu.vip/api/downloader/igdl',
                  queryParameters: {'url': resolvedUrl},
                );
                final map =
                    res.data is String ? jsonDecode(res.data) : res.data;
                final dataList = map['data'];
                if (dataList is List && dataList.isNotEmpty) {
                  final vUrl = dataList.first['url']?.toString();
                  if (vUrl != null && vUrl.startsWith('http')) {
                    return {'url': vUrl, 'title': 'فيديو ريلز انستغرام'};
                  }
                }
              } catch (_) {}

              // المحرك 5: خادم Vreden IGDL
              try {
                final res = await _dio.get(
                  'https://api.vreden.my.id/api/igdownload',
                  queryParameters: {'url': resolvedUrl},
                );
                final map =
                    res.data is String ? jsonDecode(res.data) : res.data;
                final vUrl =
                    map['result']?['response']?['data']?[0]?['url']?.toString();
                if (vUrl != null && vUrl.startsWith('http')) {
                  return {'url': vUrl, 'title': 'فيديو ريلز انستغرام'};
                }
              } catch (_) {}

              return null;
            }

            Future<void> _startVideoDownload(String rawInput) async {
              if (_isDownloading) return;

              final urlMatch = RegExp(r'https?://[^\s"<>]+').firstMatch(rawInput);
              final cleanUrl = urlMatch?.group(0) ?? rawInput.trim();

              if (!cleanUrl.contains("tiktok.com") &&
                  !cleanUrl.contains("instagram.com")) {
                setState(() {
                  _statusText =
                      "الرابط الملتقط غير مدعوم، يرجى نسخ رابط TikTok أو Instagram Reels.";
                });
                return;
              }

              setState(() {
                _isDownloading = true;
                _progress = 0.0;
                _statusText =
                    "جاري فك تشفير الرابط عبر المحركات الذكية...\n$cleanUrl";
              });

              try {
                final bool isTikTok = cleanUrl.contains("tiktok.com");
                final String platform =
                    isTikTok ? "TikTok" : "Instagram Reels";

                final Map<String, String>? extracted = isTikTok
                    ? await _extractTikTok(cleanUrl)
                    : await _extractInstagram(cleanUrl);

                final String? directUrl = extracted?['url'];
                final String videoTitle =
                    extracted?['title'] ?? "فيديو بدون علامة مائية";

                if (directUrl == null || directUrl.isEmpty) {
                  throw Exception(
                      "لم تتمكن المحركات من استخراج الفيديو، تأكد من اتصال الإنترنت وأن الفيديو عام.");
                }

                setState(() => _statusText = "جاري تنزيل الفيديو بأعلى جودة...");

                final appDir = await getApplicationDocumentsDirectory();
                final videosDir = Directory('${appDir.path}/downloaded_reels');
                if (!await videosDir.exists()) {
                  await videosDir.create(recursive: true);
                }

                final id = DateTime.now().millisecondsSinceEpoch.toString();
                final localFilePath = '${videosDir.path}/vid_$id.mp4';

                await _dio.download(
                  directUrl,
                  localFilePath,
                  onReceiveProgress: (rec, total) {
                    if (total != -1) {
                      setState(() => _progress = rec / total);
                    }
                  },
                );

                try {
                  await _channel
                      .invokeMethod('saveToGallery', {'path': localFilePath});
                } catch (_) {}

                final fileBytes = await File(localFilePath).length();
                final sizeMb =
                    "${(fileBytes / (1024 * 1024)).toStringAsFixed(1)} MB";
                final now = DateTime.now();
                final dateStr =
                    "${now.year}/${now.month.toString().padLeft(2, '0')}/${now.day.toString().padLeft(2, '0')} - ${now.hour}:${now.minute.toString().padLeft(2, '0')}";

                final newItem = DownloadedVideoItem(
                  id: id,
                  title: videoTitle,
                  platform: platform,
                  filePath: localFilePath,
                  date: dateStr,
                  sizeMb: sizeMb,
                );

                setState(() {
                  _downloadedVideos.insert(0, newItem);
                  _statusText =
                      "تم تنزيل الفيديو وحفظه في التطبيق والمعرض بنجاح!";
                  _manualUrlController.clear();
                });

                await _saveVideoListToStorage();
                await _channel.invokeMethod('vibrate', {'ms': 300});
              } catch (e) {
                setState(() {
                  _statusText =
                      "تعذر التحميل: ${e.toString().replaceAll('Exception: ', '')}";
                });
              } finally {
                setState(() => _isDownloading = false);
              }
            }

            Future<void> _deleteVideo(DownloadedVideoItem item) async {
              try {
                final f = File(item.filePath);
                if (await f.exists()) {
                  await f.delete();
                }
              } catch (_) {}

              setState(() {
                _downloadedVideos.removeWhere((v) => v.id == item.id);
              });
              await _saveVideoListToStorage();
            }

