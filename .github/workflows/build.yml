            }

            // ==========================================================
            // تبويب المكتبة
            // ==========================================================
            Widget _buildLibraryTab() {
              if (_downloadedVideos.isEmpty) {
                return Center(
                  child: Padding(
                    padding: const EdgeInsets.all(32),
                    child: Column(
                      mainAxisSize: MainAxisSize.min,
                      children: [
                        Container(
                          padding: const EdgeInsets.all(26),
                          decoration: BoxDecoration(
                            color: kCard,
                            shape: BoxShape.circle,
                            border: Border.all(color: Colors.white10),
                          ),
                          child: const Icon(Icons.video_collection_outlined,
                              size: 56, color: Colors.white30),
                        ),
                        const SizedBox(height: 20),
                        const Text(
                          "مكتبتك فارغة",
                          style: TextStyle(fontSize: 19, fontWeight: FontWeight.w800),
                        ),
                        const SizedBox(height: 8),
                        const Text(
                          "أي فيديو تحمّله بالنقر الخلفي سيظهر هنا وفي معرض هاتفك",
                          textAlign: TextAlign.center,
                          style:
                              TextStyle(fontSize: 13, color: Colors.white54, height: 1.6),
                        ),
                      ],
                    ),
                  ),
                );
              }

              return ListView.builder(
                padding: const EdgeInsets.fromLTRB(18, 10, 18, 24),
                itemCount: _downloadedVideos.length + 1,
                itemBuilder: (context, index) {
                  if (index == 0) {
                    return Padding(
                      padding: const EdgeInsets.only(bottom: 14, right: 4),
                      child: Text(
                        "${_downloadedVideos.length} فيديو محفوظ",
                        style: const TextStyle(
                            color: Colors.white60,
                            fontWeight: FontWeight.w700,
                            fontSize: 14),
                      ),
                    );
                  }
                  return _buildVideoTile(_downloadedVideos[index - 1]);
                },
              );
            }

            Widget _buildVideoTile(DownloadedVideoItem video) {
              final isTikTok = video.platform == "TikTok";
              final accent = isTikTok ? kCyan : kPink;

              return Dismissible(
                key: ValueKey(video.id),
                direction: DismissDirection.horizontal,
                background: _dismissBg(Alignment.centerRight),
                secondaryBackground: _dismissBg(Alignment.centerLeft),
                onDismissed: (_) => _deleteVideo(video),
                child: GestureDetector(
                  onTap: () => Navigator.of(context).push(
                    MaterialPageRoute(
                      builder: (_) => InAppVideoPlayerScreen(videoItem: video),
                    ),
                  ),
                  child: Container(
                    margin: const EdgeInsets.only(bottom: 12),
                    padding: const EdgeInsets.all(12),
                    decoration: BoxDecoration(
                      color: kCard,
                      borderRadius: BorderRadius.circular(20),
                      border: Border.all(color: Colors.white10),
                    ),
                    child: Row(
                      children: [
                        Container(
                          width: 72,
                          height: 72,
                          decoration: BoxDecoration(
                            gradient: LinearGradient(
                              colors: isTikTok
                                  ? [const Color(0xFF0891B2), const Color(0xFFE11D48)]
                                  : [const Color(0xFFF59E0B), const Color(0xFFDB2777)],
                              begin: Alignment.topRight,
                              end: Alignment.bottomLeft,
                            ),
                            borderRadius: BorderRadius.circular(16),
                          ),
                          child: const Icon(Icons.play_arrow_rounded,
                              size: 40, color: Colors.white),
                        ),
                        const SizedBox(width: 14),
                        Expanded(
                          child: Column(
                            crossAxisAlignment: CrossAxisAlignment.start,
                            children: [
                              Text(
                                video.title,
                                maxLines: 1,
                                overflow: TextOverflow.ellipsis,
                                style: const TextStyle(
                                    fontWeight: FontWeight.w800, fontSize: 15),
                              ),
                              const SizedBox(height: 8),
                              Row(
                                children: [
                                  Container(
                                    padding: const EdgeInsets.symmetric(
                                        horizontal: 9, vertical: 3),
                                    decoration: BoxDecoration(
                                      color: accent.withOpacity(0.16),
                                      borderRadius: BorderRadius.circular(8),
                                    ),
                                    child: Text(
                                      video.platform,
                                      style: TextStyle(
                                          fontSize: 11,
                                          fontWeight: FontWeight.w800,
                                          color: accent),
                                    ),
                                  ),
                                  const SizedBox(width: 8),
                                  Text(video.sizeMb,
                                      style: const TextStyle(
                                          fontSize: 12, color: Colors.white54)),
                                ],
                              ),
                              const SizedBox(height: 6),
                              Text(video.date,
                                  style: const TextStyle(
                                      fontSize: 11, color: Colors.white38)),
                            ],
                          ),
                        ),
                        const Icon(Icons.chevron_left_rounded, color: Colors.white24),
                      ],
                    ),
                  ),
                ),
              );
            }

            Widget _dismissBg(Alignment align) {
              return Container(
                margin: const EdgeInsets.only(bottom: 12),
                padding: const EdgeInsets.symmetric(horizontal: 24),
                alignment: align,
                decoration: BoxDecoration(
                  color: Colors.redAccent.withOpacity(0.25),
                  borderRadius: BorderRadius.circular(20),
                ),
                child: const Icon(Icons.delete_rounded, color: Colors.redAccent),
              );
            }
          }

          // ==========================================================
          // شاشة مشغل الفيديو الداخلي
          // ==========================================================
          class InAppVideoPlayerScreen extends StatefulWidget {
            final DownloadedVideoItem videoItem;
            const InAppVideoPlayerScreen({super.key, required this.videoItem});

            @override
            State<InAppVideoPlayerScreen> createState() => _InAppVideoPlayerScreenState();
          }

          class _InAppVideoPlayerScreenState extends State<InAppVideoPlayerScreen> {
            late VideoPlayerController _controller;
            bool _initialized = false;

            @override
            void initState() {
              super.initState();
              _controller = VideoPlayerController.file(File(widget.videoItem.filePath))
                ..initialize().then((_) {
                  if (!mounted) return;
                  setState(() => _initialized = true);
                  _controller.setLooping(true);
                  _controller.play();
                });
              _controller.addListener(() {
                if (mounted) setState(() {});
              });
            }

            @override
            void dispose() {
              _controller.dispose();
              super.dispose();
            }

            @override
            Widget build(BuildContext context) {
              return Directionality(
                textDirection: TextDirection.rtl,
                child: Scaffold(
                  backgroundColor: Colors.black,
                  extendBodyBehindAppBar: true,
                  appBar: AppBar(
                    backgroundColor: Colors.transparent,
                    elevation: 0,
                    title: Text(
                      widget.videoItem.title,
                      maxLines: 1,
                      overflow: TextOverflow.ellipsis,
                      style: const TextStyle(fontSize: 15),
                    ),
                  ),
                  body: _initialized
                      ? GestureDetector(
                          onTap: () => _controller.value.isPlaying
                              ? _controller.pause()
                              : _controller.play(),
                          child: Stack(
                            alignment: Alignment.center,
                            children: [
                              Center(
                                child: AspectRatio(
                                  aspectRatio: _controller.value.aspectRatio,
                                  child: VideoPlayer(_controller),
                                ),
                              ),
                              AnimatedOpacity(
                                opacity: _controller.value.isPlaying ? 0 : 1,
                                duration: const Duration(milliseconds: 200),
                                child: Container(
                                  padding: const EdgeInsets.all(18),
                                  decoration: const BoxDecoration(
                                    color: Colors.black54,
                                    shape: BoxShape.circle,
                                  ),
                                  child: const Icon(Icons.play_arrow_rounded,
                                      size: 56, color: Colors.white),
                                ),
                              ),
                              Positioned(
                                left: 16,
                                right: 16,
                                bottom: 28,
                                child: VideoProgressIndicator(
                                  _controller,
                                  allowScrubbing: true,
                                  padding: const EdgeInsets.symmetric(vertical: 12),
                                  colors: const VideoProgressColors(
                                    playedColor: kCyan,
                                    bufferedColor: Colors.white24,
                                    backgroundColor: Colors.white12,
                                  ),
                                ),
                              ),
                            ],
                          ),
                        )
                      : const Center(child: CircularProgressIndicator(color: kCyan)),
                ),
              );
            }
          }
          EOF

      - name: Build Release APK
        run: |
          cd app_build
          flutter build apk --release

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Auto-Reel-Saver-APK
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
