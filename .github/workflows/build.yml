                          borderSide: BorderSide.none,
                        ),
                        suffixIcon: IconButton(
                          icon: const Icon(Icons.content_paste_rounded, color: kCyan),
                          onPressed: () async {
                            final data = await Clipboard.getData(Clipboard.kTextPlain);
